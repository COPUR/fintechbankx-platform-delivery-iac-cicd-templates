name: Java23 Quality Gates

# Minimal GitHub Actions caller (primary CI path) for repositories that only
# need the quality gates. For the full pipeline (image + deploy) use
# templates/github/workflows/service-pipeline.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - dev
      - staging

permissions:
  contents: read

jobs:
  ci:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/java-service-ci.yml@main
    permissions:
      contents: read
    # with:
    #   archunit-base-packages: com.bank.<context>   # or com.enterprise.openfinance.<capability>
    #   postgres-enabled: true
    #   postgres-db: db_<ctx>_<cap>_test

  tdd:
    if: ${{ github.event_name == 'pull_request' }}
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/tdd-gate.yml@main
    permissions:
      contents: read

  contracts:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/contract-checks.yml@main
    permissions:
      contents: read

  security:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/security.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
