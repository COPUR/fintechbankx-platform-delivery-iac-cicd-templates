name: Java23 Quality Gates

# Minimal GitHub Actions caller (primary CI path) for repositories that only
# need the quality gates. For the full pipeline (image + deploy) use
# templates/github/workflows/service-pipeline.yml.
#
# Pinning: every reusable workflow below is pinned to the platform release
# v1.0.0, and platform-ref names the same release, so the workflow code and the
# chart/tools it fetches come from one reviewed commit. In a service repo pin
# the release commit SHA with the tag as a comment
# (".../helm-deploy.yml@<40-hex sha> # v1.0.0") and let Renovate or Dependabot
# (github-actions ecosystem) bump all of them together. helm-deploy rejects a
# branch as platform-ref for prod. @main is only for experiments in dev, never
# in a pipeline that can reach staging or prod.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - dev
      - staging

permissions:
  contents: read

jobs:
  ci:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/java-service-ci.yml@v1.0.0
    permissions:
      contents: read
    with:
      platform-ref: v1.0.0
      # Required (rule 5): the repository's one package root. Replace with com.bank.<context>,
      # com.enterprise.openfinance.<capability> or com.fintechbankx.<context>.<capability>.
      package-root: com.fintechbankx.example.capability
    #   postgres-enabled: true
    #   postgres-db: db_<ctx>_<cap>_test

  tdd:
    if: ${{ github.event_name == 'pull_request' }}
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/tdd-gate.yml@v1.0.0
    permissions:
      contents: read
    with:
      platform-ref: v1.0.0

  contracts:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/contract-checks.yml@v1.0.0
    permissions:
      contents: read

  security:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/security.yml@v1.0.0
    permissions:
      contents: read
      actions: read
      security-events: write

  # Required status checks. Checks from a reusable workflow are named
  # "<caller job> / <called job>", so they can never match branch protection's
  # ci/build, ci/test and ci/security. These three local jobs carry exactly those
  # names and pass only when the gates behind them passed (skipped is fine, e.g.
  # the tdd gate on push), so branch protection stays unchanged.
  required-build:
    name: ci/build
    if: ${{ always() }}
    needs: [ci]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: ci (check + ArchUnit gate) passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  required-test:
    name: ci/test
    if: ${{ always() }}
    needs: [ci, tdd, contracts]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: tests, tdd gate and contract checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  required-security:
    name: ci/security
    if: ${{ always() }}
    needs: [security]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: security gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
