name: service-pipeline

# Sample caller for a FinTechBankX service repository (copy to
# .github/workflows/service-pipeline.yml and replace the values marked <...>).
# GitHub Actions is the primary delivery path; Jenkins and GitLab templates in
# this repository are secondary.
#
#   pull_request: ci (check + ArchUnit gate) + tdd gate + contracts + db migration rehearsal + security
#   push to main: the same gates, then image -> dev -> staging -> prod
#
# Repository variables (Settings > Secrets and variables > Variables):
#   AWS_REGION                      e.g. me-central-1
#   ECR_PUSH_ROLE_ARN               OIDC role allowed to push to this service's ECR repo
#   EKS_DEPLOY_ROLE_ARN_DEV|STAGING|PROD   OIDC roles mapped to namespaced deploy RBAC
#   EKS_CLUSTER_DEV|STAGING|PROD    EKS cluster names
# GitHub environments: dev (no reviewers), staging and prod (required reviewers,
# deployment branch rule: main only).
#
# Skeleton copy: replace example-service, svc-ex-example and the example namespace.

on:
  pull_request:
    branches: [main, dev, staging]
    # labeled/unlabeled re-run the tdd gate when no-behaviour-change is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/java-service-ci.yml@main
    permissions:
      contents: read
    with:
      postgres-enabled: true
      postgres-db: db_ex_example_test
      postgres-user: example_test
      archunit-base-packages: com.fintechbankx.example.capability
      archunit-layout: single-module

  tdd:
    if: ${{ github.event_name == 'pull_request' }}
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/tdd-gate.yml@main
    permissions:
      contents: read

  contracts:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/contract-checks.yml@main
    permissions:
      contents: read

  migrations:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/db-migration-verify.yml@main
    permissions:
      contents: read
    with:
      schema: sc_ex_example

  security:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/security.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      run-codeql: true

  # Required status checks. Checks from a reusable workflow are named
  # "<caller job> / <called job>", so they can never match branch protection's
  # ci/build, ci/test and ci/security. These three local jobs carry exactly those
  # names and pass only when the gates behind them passed (skipped is fine, e.g.
  # the tdd gate on push), so branch protection stays unchanged.
  required-build:
    name: ci/build
    if: ${{ always() }}
    needs: [ci]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: ci (check + ArchUnit gate) passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  required-test:
    name: ci/test
    if: ${{ always() }}
    needs: [ci, tdd, contracts, migrations]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: tests, tdd gate and contract checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  required-security:
    name: ci/security
    if: ${{ always() }}
    needs: [security]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: security gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  image:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ci, contracts, migrations, security]
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/container-image.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      image-name: fintechbankx/example-service
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}

  deploy-dev:
    needs: image
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/helm-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      namespace: example
      release-name: example-service
      values-files: deploy/helm/values.yaml deploy/helm/values-dev.yaml
      image-repository: ${{ needs.image.outputs.image-repository }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      image-tag: ${{ needs.image.outputs.image-tag }}
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN_DEV }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_DEV }}

  deploy-staging:
    needs: [image, deploy-dev]
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/helm-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      namespace: example
      release-name: example-service
      values-files: deploy/helm/values.yaml deploy/helm/values-staging.yaml
      image-repository: ${{ needs.image.outputs.image-repository }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      image-tag: ${{ needs.image.outputs.image-tag }}
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN_STAGING }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_STAGING }}

  deploy-prod:
    needs: [image, deploy-staging]
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/helm-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      namespace: example
      release-name: example-service
      values-files: deploy/helm/values.yaml deploy/helm/values-prod.yaml
      image-repository: ${{ needs.image.outputs.image-repository }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      image-tag: ${{ needs.image.outputs.image-tag }}
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN_PROD }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_PROD }}
