# Runtime defaults for a FinTechBankX service. Environment-specific values come
# from the Helm ConfigMap and the ExternalSecret; nothing secret lives here.
spring:
  application:
    name: example-service
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
