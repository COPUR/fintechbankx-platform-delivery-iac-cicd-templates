name: service-pipeline

# Sample caller for a FinTechBankX service repository (copy to
# .github/workflows/service-pipeline.yml and replace the values marked <...>).
# GitHub Actions is the primary delivery path; Jenkins and GitLab templates in
# this repository are secondary.
#
#   pull_request: ci (check + ArchUnit gate) + tdd gate + contracts + db migration rehearsal + security
#   push to main: the same gates, then image -> dev -> staging -> prod
#
# Repository variables (Settings > Secrets and variables > Variables):
#   AWS_REGION                      e.g. me-central-1
#   ECR_PUSH_ROLE_ARN               OIDC role allowed to push to this service's ECR repo
#   EKS_DEPLOY_ROLE_ARN_DEV|STAGING|PROD   OIDC roles mapped to namespaced deploy RBAC
#   EKS_CLUSTER_DEV|STAGING|PROD    EKS cluster names
# GitHub environments: dev (no reviewers), staging and prod (required reviewers,
# deployment branch rule: main only).
#
# This example uses svc-ln-loan-lifecycle; adjust names for your service.
#
# Pinning: every reusable workflow below is pinned to the platform release
# v1.0.0, and platform-ref names the same release, so the workflow code and the
# chart/tools it fetches come from one reviewed commit. In a service repo pin
# the release commit SHA with the tag as a comment
# (".../helm-deploy.yml@<40-hex sha> # v1.0.0") and let Renovate or Dependabot
# (github-actions ecosystem) bump all of them together. helm-deploy rejects a
# branch as platform-ref for prod. @main is only for experiments in dev, never
# in a pipeline that can reach staging or prod.

on:
  pull_request:
    branches: [main, dev, staging]
    # labeled/unlabeled re-run the tdd gate (no-behaviour-change) and contract-checks
    # (contract-break-approved) when the label is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/java-service-ci.yml@v1.0.0
    permissions:
      contents: read
    with:
      platform-ref: v1.0.0
      postgres-enabled: true
      postgres-db: db_ln_loan_lifecycle_test
      postgres-user: loan_test
      # Rule 5: the repository's one package root; replace with yours
      # (com.bank.<context>, com.enterprise.openfinance.<capability> or com.fintechbankx.<context>.<capability>).
      package-root: com.bank.loan
      archunit-layout: multi-module

  tdd:
    if: ${{ github.event_name == 'pull_request' }}
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/tdd-gate.yml@v1.0.0
    permissions:
      contents: read
    with:
      platform-ref: v1.0.0

  contracts:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/contract-checks.yml@v1.0.0
    permissions:
      contents: read

  migrations:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/db-migration-verify.yml@v1.0.0
    permissions:
      contents: read
    with:
      schema: sc_ln_loan_lifecycle

  security:
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/security.yml@v1.0.0
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      run-codeql: true

  image:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ci, contracts, migrations, security]
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/container-image.yml@v1.0.0
    permissions:
      contents: read
      id-token: write
    with:
      image-name: fintechbankx/loan-lifecycle-service
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}

  deploy-dev:
    needs: image
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/helm-deploy.yml@v1.0.0
    permissions:
      contents: read
      id-token: write
    with:
      platform-ref: v1.0.0
      environment: dev
      namespace: lending
      release-name: loan-lifecycle-service
      values-files: deploy/helm/values.yaml deploy/helm/values-dev.yaml
      image-repository: ${{ needs.image.outputs.image-repository }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      image-tag: ${{ needs.image.outputs.image-tag }}
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN_DEV }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_DEV }}

  deploy-staging:
    needs: [image, deploy-dev]
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/helm-deploy.yml@v1.0.0
    permissions:
      contents: read
      id-token: write
    with:
      platform-ref: v1.0.0
      environment: staging
      namespace: lending
      release-name: loan-lifecycle-service
      values-files: deploy/helm/values.yaml deploy/helm/values-staging.yaml
      image-repository: ${{ needs.image.outputs.image-repository }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      image-tag: ${{ needs.image.outputs.image-tag }}
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN_STAGING }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_STAGING }}

  deploy-prod:
    needs: [image, deploy-staging]
    uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/helm-deploy.yml@v1.0.0
    permissions:
      contents: read
      id-token: write
    with:
      platform-ref: v1.0.0
      environment: prod
      namespace: lending
      release-name: loan-lifecycle-service
      values-files: deploy/helm/values.yaml deploy/helm/values-prod.yaml
      image-repository: ${{ needs.image.outputs.image-repository }}
      image-digest: ${{ needs.image.outputs.image-digest }}
      image-tag: ${{ needs.image.outputs.image-tag }}
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.EKS_DEPLOY_ROLE_ARN_PROD }}
      eks-cluster-name: ${{ vars.EKS_CLUSTER_PROD }}
