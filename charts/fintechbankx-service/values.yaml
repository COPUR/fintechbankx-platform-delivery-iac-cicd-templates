# Generic FinTechBankX service chart. Defaults are production-shaped
# (3 replicas, zone spread, PDB, non-root, read-only root FS). Override per
# environment with values-<env>.yaml in the service repo.
#
# Required (enforced by values.schema.json and `required`):
#   serviceName, serviceId, boundedContext, image.repository and image.tag or image.digest

# Kubernetes name of the workload; also app.kubernetes.io/name and the default
# ServiceAccount name (PLATFORM_CONTRACT: <sa>, e.g. loan-lifecycle-service).
serviceName: ""
# Service id from the naming standard, e.g. svc-ln-loan-lifecycle.
serviceId: ""
# Bounded context / namespace context, e.g. lending, payments, customer, risk, compliance.
boundedContext: ""
owningSquad: ""
# dev | staging | prod; used for telemetry resource attributes.
environment: ""

image:
  repository: ""   # <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/<serviceName>
  tag: ""          # immutable tag (git SHA); "latest" is rejected
  digest: ""       # sha256:...; when set the image is pinned by digest (preferred for deploys)
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 3
revisionHistoryLimit: 5
terminationGracePeriodSeconds: 45

serviceAccount:
  create: true
  name: ""          # defaults to serviceName
  # IRSA role (service repo deploy/terraform output workload_role_arn).
  roleArn: ""
  annotations: {}
  automountToken: true

podLabels: {}
podAnnotations: {}

service:
  port: 8080            # API
  managementPort: 8081  # actuator health + prometheus

resources:
  requests:
    cpu: 500m
    memory: 768Mi
    ephemeral-storage: 128Mi
  limits:
    memory: 1Gi
    ephemeral-storage: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpread:
  maxSkew: 1
  # Zones are a hard constraint so a single-AZ outage never takes all replicas.
  zoneWhenUnsatisfiable: DoNotSchedule
  hostWhenUnsatisfiable: ScheduleAnyway

probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 5
    failureThreshold: 36
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    failureThreshold: 3

# Seconds the pod keeps serving after it is removed from endpoints (integer;
# rendered with int, like every number written into the pod spec).
preStopSleepSeconds: 10

# Rendered as JAVA_TOOL_OPTIONS; checked by the JVM option rule of the guard
# (see databaseCa below).
javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

# Non-secret runtime settings, rendered into a ConfigMap and loaded with envFrom.
# Keys and values go through the guard (see databaseCa below).
config: {}

# Amazon RDS / DocumentDB CA bundle for TLS with certificate verification
# (Aurora JDBC sslmode=verify-full&sslrootcert=<mountPath>/<key>, the
# terraform-modules aurora-postgresql jdbc_url output). The mesh platform repo's
# trust-manager Bundle rds-ca-bundle publishes the ConfigMap in every service
# namespace. The volume is not optional: a missing bundle keeps the pod from
# starting instead of letting it connect without verification. The path is
# also exported as DB_SSL_ROOT_CERT.
#
# Datasource and TLS guard (fbx.guard; README "Datasource and TLS guard"),
# over config keys, extraEnv (value or valueFrom), externalSecret data/extraData
# secretKeys and javaToolOptions; rendering fails otherwise:
#   - names are checked as given and in their Spring relaxed-binding form
#     (every character other than [a-z0-9] inside an element ignored, foo[bar]
#     and '_' read as '.'): no
#     spring.config.* or spring.profiles.* name (indexed forms included; the
#     chart renders the only profile, from kafka.runtime below), no
#     fintechbankx.tls.* (the service's startup TLS assertion off switch) or
#     spring.application.json, no spring.ssl.* or *ssl.bundle name, no
#     spring.datasource/flyway/liquibase/r2dbc name except
#     SPRING_DATASOURCE_USERNAME/PASSWORD, and no name containing jdbc url,
#     ssl factory, ssl host name verifier, ssl password callback, ssl root cert
#     (DB_SSL_ROOT_CERT is the chart's own) or ssl mode, separators optional;
#     no Kafka client TLS name, spring.kafka[.<client>].ssl.* or
#     spring.kafka[.<client>].properties.ssl.*, other than the value-checked
#     ssl.endpoint.identification.algorithm (see kafka below);
#   - KAFKA_TLS_CERT, KAFKA_TLS_KEY and KAFKA_TLS_CA only from a Secret
#     (extraEnv valueFrom.secretKeyRef or externalSecret data/extraData), in
#     exactly that spelling, never under config;
#   - DB_URL only as the config key DB_URL (db.url, db-url, dbUrl are
#     refused); a non-empty value must be a jdbc:[<wrapper>:]postgresql: URL
#     with exactly one sslmode=verify-full and, while databaseCa is enabled,
#     exactly one sslrootcert=<mountPath>/<key>, and no sslfactory,
#     sslfactoryarg, sslhostnameverifier, sslpasswordcallback or service, and
#     no '${' or '$(' (resolved after the check);
#   - JVM options (javaToolOptions, JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS,
#     _JAVA_OPTIONS) must not mention datasource, flyway, liquibase, r2dbc,
#     jdbc, ssl, application.json, spring.config, spring.profiles,
#     fintechbankx.tls, security.protocol, endpoint.identification, kafka.tls,
#     java.security.properties, jdk.tls or hostname verification (also with
#     every character other than [a-z0-9] removed, e.g. -Dspring..config.import),
#     must be printable ASCII, must not contain '$(' or '${', nor read an
#     options file ('@' argument file, also quoted, -XX:VMOptionsFile,
#     -XX:Flags), need a literal extraEnv value and may not come from the
#     ExternalSecret;
#   - no extraEnv value contains '$(' (Kubernetes expands $(VAR) after the
#     check; use valueFrom);
#   - config keys and secretKeys are ConfigMap/Secret keys ([-._a-zA-Z0-9]+),
#     extraEnv names printable ASCII other than '=' and white space;
#   - no envFrom, extraEnvFrom or externalSecret.dataFrom value.
databaseCa:
  enabled: true
  configMapName: rds-ca-bundle
  key: global-bundle.pem
  mountPath: /etc/fintechbankx/rds-ca

# Kafka auth profile (the Kafka repo's client guide). The chart renders the
# only Spring profile from it: msk -> SPRING_PROFILES_ACTIVE=kafka-msk (Amazon
# MSK IAM, security.protocol SASL_SSL), strimzi -> kafka-strimzi (Strimzi
# mutual TLS, SSL), "" -> no profile (services without Kafka only: a
# security.protocol name below fails rendering while runtime is ""). Every
# user-set spring.profiles.* name is rejected (config, extraEnv,
# externalSecret keys, JVM options).
# fbx.validateKafkaTls: a config key or extraEnv name ending in
# security[._-]?protocol (KAFKA_SECURITY_PROTOCOL, SPRING_KAFKA_SECURITY_PROTOCOL,
# SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL, ...) must be SASL_SSL or SSL
# (SASL_SSL with msk, SSL with strimzi); PLAINTEXT, SASL_PLAINTEXT and empty are
# rejected. A name containing endpoint[._-]?identification[._-]?algorithm must
# be https. Both name rules also apply to the Spring relaxed-binding form
# (lower case, characters other than [a-z0-9] inside an element ignored,
# foo[bar] read as foo.bar), e.g.
# spring.kafka.secu-rity.protocol, spring.kafka.properties[security.protocol].
# Both need a literal extraEnv value (no valueFrom) and may not come from the
# ExternalSecret. Whatever the runtime, every other spring.kafka[.<client>].ssl.*
# and spring.kafka[.<client>].properties.ssl.* name is refused (the profile in
# the image sets the client's TLS material), and the kafka-strimzi profile's
# KAFKA_TLS_CERT, KAFKA_TLS_KEY and KAFKA_TLS_CA come only from a Secret: an
# extraEnv entry with valueFrom.secretKeyRef (the Kafka repo's client guide
# maps them from Secret kafka-client-tls) or an externalSecret key.
kafka:
  runtime: ""

# Extra env entries (Kubernetes EnvVar objects), rendered after the chart's own
# entries. Names (value or valueFrom) and literal values go through the guard
# (see databaseCa above).
extraEnv: []

# Secrets synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  apiVersion: external-secrets.io/v1beta1
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Secrets Manager secret name (service repo deploy/terraform output app_db_secret_name).
  # Must start with <environment>/<serviceName>/ (schema checks the shape, template the prefix).
  remoteSecretName: ""
  refreshInterval: 1h
  # Env var name -> JSON property of the remote secret.
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      property: password
  # Additional keys from this service's own secrets only: remoteSecretName must
  # start with <environment>/<serviceName>/ (template fails otherwise), e.g. the
  # Keycloak client credential
  # <env>/<service-slug>/oidc-client.
  extraData: []
  #  - secretKey: OIDC_CLIENT_SECRET
  #    remoteSecretName: dev/loan-lifecycle-service/oidc-client
  #    property: client_secret

observability:
  tracing:
    enabled: true
    otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  # The single scrape path is the observability platform repo's PodMonitor
  # fintechbankx-services (fintechbankx-platform-observability-sre-operations,
  # deploy/kustomize/base/monitors/podmonitor-fintechbankx-services.yaml): it
  # selects pods labelled fintechbankx.io/service-id and scrapes Istio's merged
  # metrics on 15020 (app metrics merged via the prometheus.io annotations the
  # chart sets while serviceMonitor is disabled).
  serviceMonitor:
    # Opt-in only, for clusters without that PodMonitor; enabling it drops the
    # prometheus.io annotations so the app is not scraped twice. Needs the
    # Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# NetworkPolicy is owned by the service-mesh platform repo
# (fintechbankx-platform-mesh-security-service-mesh, k8s/istio/security/network-policies.yaml),
# like AuthorizationPolicy, so the chart renders none by default. Enable only for a
# cluster the mesh repo does not cover, and never with an any-address CIDR.
networkPolicy:
  enabled: false
  # Namespaces allowed to call the API port (the own namespace is always allowed).
  ingressNamespaces:
    - istio-ingress
  # Namespaces allowed to scrape the management port and Envoy stats.
  monitoringNamespaces:
    - observability
  # In-cluster egress: namespace + TCP ports.
  egressNamespaces:
    - name: istio-system
      ports: [15012, 15017]
    - name: observability
      ports: [4317, 4318]
    - name: identity
      ports: [8080, 8443]
  # Egress outside the cluster (Aurora 5432, MSK IAM 9098, AWS APIs 443), as
  # VPC / VPC endpoint ranges per environment, e.g.
  #   - cidr: 10.20.0.0/16
  #     ports: [443, 5432, 9098]
  # 0.0.0.0/0 and ::/0 are rejected by values.schema.json; public IPv4 wider
  # than /16 (outside RFC1918 and 100.64.0.0/10), public IPv6 wider than /48
  # (outside the ULA block fc00::/7) and IPv4-mapped IPv6 (::ffff:0:0/96) or
  # NAT64 (64:ff9b::/96, 64:ff9b:1::/48) by fbx.validateEgressCidrs.
  egressCidrs: []

istio:
  # Labels and annotations that make the pod mesh-ready (PLATFORM_CONTRACT
  # addendum "Mesh membership"). The namespace carries istio-injection=enabled.
  # STRICT mTLS, namespace default-deny and per-caller ALLOW AuthorizationPolicies
  # are owned by the service-mesh platform repo, so this chart ships none, and it
  # never sets traffic.sidecar.istio.io/excludeInboundPorts (probes use Istio's
  # probe rewrite).
  inject: true
  holdApplicationUntilProxyStarts: true

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
