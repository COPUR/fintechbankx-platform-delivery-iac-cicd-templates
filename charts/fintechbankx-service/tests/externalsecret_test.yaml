suite: externalsecret - aws-secrets-manager ClusterSecretStore
templates:
  - templates/externalsecret.yaml
values:
  - ../ci/loan-lifecycle-values.yaml
tests:
  - it: reads from the ClusterSecretStore aws-secrets-manager
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: spec.secretStoreRef.kind, value: ClusterSecretStore}
      - equal: {path: spec.secretStoreRef.name, value: aws-secrets-manager}
      - equal: {path: spec.target.name, value: loan-lifecycle-service-secrets}
  - it: maps the database credential and the extra OIDC client credential
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: SPRING_DATASOURCE_PASSWORD
            remoteRef: {key: staging/loan-lifecycle-service/db-app, property: password}
      - contains:
          path: spec.data
          content:
            secretKey: OIDC_CLIENT_SECRET
            remoteRef: {key: staging/loan-lifecycle-service/oidc-client, property: client_secret}
  - it: requires the remote secret name
    set:
      externalSecret.remoteSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: externalSecret.remoteSecretName is required
  - it: renders nothing when disabled
    set:
      externalSecret.enabled: false
    asserts:
      - hasDocuments: {count: 0}
