suite: externalsecret - aws-secrets-manager ClusterSecretStore
templates:
  - templates/externalsecret.yaml
values:
  - ../ci/loan-lifecycle-values.yaml
tests:
  - it: reads from the ClusterSecretStore aws-secrets-manager
    asserts:
      - isKind: {of: ExternalSecret}
      - equal: {path: spec.secretStoreRef.kind, value: ClusterSecretStore}
      - equal: {path: spec.secretStoreRef.name, value: aws-secrets-manager}
      - equal: {path: spec.target.name, value: loan-lifecycle-service-secrets}
  - it: maps the database credential and the extra OIDC client credential
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: SPRING_DATASOURCE_PASSWORD
            remoteRef: {key: staging/loan-lifecycle-service/db-app, property: password}
      - contains:
          path: spec.data
          content:
            secretKey: OIDC_CLIENT_SECRET
            remoteRef: {key: staging/loan-lifecycle-service/oidc-client, property: client_secret}
  - it: requires the remote secret name
    set:
      externalSecret.remoteSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: externalSecret.remoteSecretName is required
  - it: renders nothing when disabled
    set:
      externalSecret.enabled: false
    asserts:
      - hasDocuments: {count: 0}
  - it: accepts extraData keys under <environment>/<serviceName>/
    set:
      externalSecret.extraData:
        - secretKey: OIDC_CLIENT_SECRET
          remoteSecretName: staging/loan-lifecycle-service/oidc-client
          property: client_secret
        - secretKey: KAFKA_SASL_PASSWORD
          remoteSecretName: staging/loan-lifecycle-service/kafka/scram
          property: password
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: KAFKA_SASL_PASSWORD
            remoteRef: {key: staging/loan-lifecycle-service/kafka/scram, property: password}
  - it: rejects an extraData key owned by another service
    set:
      externalSecret.extraData:
        - secretKey: OIDC_CLIENT_SECRET
          remoteSecretName: staging/payment-initiation-settlement-service/oidc-client
          property: client_secret
    asserts:
      - failedTemplate:
          errorPattern: must start with "staging/loan-lifecycle-service/"
  - it: rejects an extraData key from another environment
    set:
      externalSecret.extraData:
        - secretKey: OIDC_CLIENT_SECRET
          remoteSecretName: prod/loan-lifecycle-service/oidc-client
          property: client_secret
    asserts:
      - failedTemplate:
          errorPattern: must start with "staging/loan-lifecycle-service/"
  - it: rejects a service-name prefix trick
    set:
      externalSecret.extraData:
        - secretKey: OIDC_CLIENT_SECRET
          remoteSecretName: staging/loan-lifecycle-service-admin/oidc-client
          property: client_secret
    asserts:
      - failedTemplate:
          errorPattern: must start with "staging/loan-lifecycle-service/"
  - it: rejects platform secrets outside the service prefix
    set:
      externalSecret.extraData:
        - secretKey: KEYCLOAK_ADMIN
          remoteSecretName: staging/identity-keycloak/admin
          property: password
    asserts:
      - failedTemplate:
          errorPattern: must start with "staging/loan-lifecycle-service/"
  - it: requires environment when extraData is set
    set:
      environment: ""
      externalSecret.extraData:
        - secretKey: OIDC_CLIENT_SECRET
          remoteSecretName: staging/loan-lifecycle-service/oidc-client
          property: client_secret
    asserts:
      - failedTemplate:
          errorPattern: environment is required when externalSecret.extraData is set
