suite: JVM option routes (JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS, _JAVA_OPTIONS, javaToolOptions)
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
values:
  - ../ci/loan-lifecycle-values.yaml
release:
  name: ci
  namespace: lending
tests:
  # The JVM reads JAVA_TOOL_OPTIONS, JDK_JAVA_OPTIONS and _JAVA_OPTIONS itself
  # (fbx.isJvmOptionsName); the chart renders javaToolOptions as
  # JAVA_TOOL_OPTIONS. JAVA_OPTS reaches no JVM in the template image (exec-form
  # ENTRYPOINT, no launcher; scripts/ci/test/microservice-launcher.test.mjs).
  # fbx.validateJvmOptions refuses a value that mentions any refused name
  # (other suites cover datasource, spring.config, spring.profiles,
  # fintechbankx.tls, application.json, ssl, security.protocol,
  # endpoint.identification) or reads options or security properties from a
  # file, and the names need a literal extraEnv value and may not come from
  # the ExternalSecret.
  - it: rejects JDK_JAVA_OPTIONS with a quoted '@' argument file
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: JDK_JAVA_OPTIONS
          value: '-Xss512k "@/tmp/jvm.args"'
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv.JDK_JAVA_OPTIONS must not mention"
  - it: rejects javaToolOptions with a single-quoted '@' argument file
    template: templates/deployment.yaml
    set:
      javaToolOptions: "'@/tmp/jvm.args'"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with -Djava.security.properties (security properties file)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Djava.security.properties==/tmp/override.security"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects config JDK_JAVA_OPTIONS with -Djdk.tls.client.protocols
    template: templates/deployment.yaml
    set:
      config.JDK_JAVA_OPTIONS: "-Djdk.tls.client.protocols=TLSv1"
    asserts:
      - failedTemplate:
          errorPattern: "config.JDK_JAVA_OPTIONS must not mention"
  - it: rejects extraEnv _JAVA_OPTIONS with -Djdk.internal.httpclient.disableHostnameVerification
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: _JAVA_OPTIONS
          value: "-Djdk.internal.httpclient.disableHostnameVerification=true"
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv._JAVA_OPTIONS must not mention"
  - it: rejects javaToolOptions with -DSPRING_CONFIG_IMPORT_0_ (env spelling as a system property)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-DSPRING_CONFIG_IMPORT_0_=optional:file:/tmp/x.yml"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with -Dspring.ssl.bundle (ssl mention)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Dspring.ssl.bundle.pem.x.truststore.certificate=file:/tmp/ca.pem"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects extraEnv JAVA_TOOL_OPTIONS with -Dspring.application.j-s-o-n
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: JAVA_TOOL_OPTIONS
          value: '-Dspring.application.j-s-o-n={"fintechbankx.tls.enforce":false}'
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv.JAVA_TOOL_OPTIONS must not mention"
  - it: rejects externalSecret.extraData materialising _JAVA_OPTIONS
    template: templates/deployment.yaml
    set:
      externalSecret.extraData:
        - secretKey: _JAVA_OPTIONS
          remoteSecretName: staging/loan-lifecycle-service/jvm
          property: opts
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.extraData must not materialise _JAVA_OPTIONS"
  - it: rejects extraEnv _JAVA_OPTIONS from valueFrom
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: _JAVA_OPTIONS
          valueFrom:
            secretKeyRef: {name: other, key: opts}
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv _JAVA_OPTIONS must set a literal value"
  - it: accepts common JVM options (control)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
      extraEnv:
        - name: JDK_JAVA_OPTIONS
          value: "-Xss512k -Dmail.from=ops@example.invalid"
    asserts:
      - notFailedTemplate: {}
  # Spring Boot skips every character other than [a-z0-9] inside a system
  # property name element, ignores empty elements and lower-cases with
  # Character.toLowerCase (U+0130 'İ' -> 'i'), so each of these binds the
  # refused property (checked against Spring Boot 3.3). fbx.validateJvmOptions
  # matches its rule against the value with every character other than
  # [a-z0-9] removed (once keeping and once dropping white space) and refuses
  # any character outside printable ASCII.
  - it: rejects javaToolOptions with -Dspring..config.import (empty element)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Dspring..config.import=optional:file:/tmp/x.yml"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with -Dspring.[config].import (dot before a bracket)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Dspring.[config].import=optional:file:/tmp/x.yml"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with -Dspring..profiles.active
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Dspring..profiles.active=local"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects extraEnv JDK_JAVA_OPTIONS with -Dspring.[profiles].active
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: JDK_JAVA_OPTIONS
          value: "-Dspring.[profiles].active=local"
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv.JDK_JAVA_OPTIONS must not mention"
  - it: rejects config _JAVA_OPTIONS with -Dfintechbankx..tls.enforce
    template: templates/deployment.yaml
    set:
      config:
        _JAVA_OPTIONS: "-Dfintechbankx..tls.enforce=false"
    asserts:
      - failedTemplate:
          errorPattern: "config._JAVA_OPTIONS must not mention"
  - it: rejects javaToolOptions with -Dspring.application..json carrying nested JSON
    template: templates/deployment.yaml
    set:
      javaToolOptions: >-
        -Dspring.application..json='{"spring":{"profiles":{"active":"local"}},"fintechbankx":{"tls":{"enforce":"false"}}}'
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with -Dspring[application][json] carrying nested JSON
    template: templates/deployment.yaml
    set:
      javaToolOptions: >-
        -Dspring[application][json]='{"spring":{"config":{"import":"optional:file:/tmp/x.yml"}}}'
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with a non-ASCII capital I (-Dsprİng.profiles.active)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Dsprİng.profiles.active=local"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must contain only printable ASCII"
  - it: rejects javaToolOptions with -Dspring.kafka.security..protocol under kafka.runtime msk
    template: templates/deployment.yaml
    set:
      kafka.runtime: msk
      javaToolOptions: "-Dspring.kafka.security..protocol=PLAINTEXT"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects javaToolOptions with -Dspring.con:fig.import (':' inside an element)
    template: templates/deployment.yaml
    set:
      javaToolOptions: "-Dspring.con:fig.import=optional:file:/tmp/x.yml"
    asserts:
      - failedTemplate:
          errorPattern: "javaToolOptions must not mention"
  - it: rejects extraEnv JAVA_TOOL_OPTIONS with -Dspring.pro_files.active ('_' inside an element)
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: JAVA_TOOL_OPTIONS
          value: "-Dspring.pro_files.active=local"
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv.JAVA_TOOL_OPTIONS must not mention"
  - it: rejects extraEnv JDK_JAVA_OPTIONS with a quoted name containing a space
    template: templates/deployment.yaml
    set:
      extraEnv:
        - name: JDK_JAVA_OPTIONS
          value: '"-Dspring.pro files.active=local"'
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv.JDK_JAVA_OPTIONS must not mention"
