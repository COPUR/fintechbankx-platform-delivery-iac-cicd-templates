{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion | quote }}
kind: ExternalSecret
metadata:
  name: {{ include "fbx.secretName" . }}
  labels:
    {{- include "fbx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "fbx.secretName" . }}
    creationPolicy: Owner
  data:
    {{- /* Every key may only read this release's own secrets: <environment>/<serviceName>/... */}}
    {{- $remote := .Values.externalSecret.remoteSecretName }}
    {{- $prefix := "" }}
    {{- if or .Values.externalSecret.data .Values.externalSecret.extraData }}
    {{- $prefix = printf "%s/%s/" (required "environment is required when externalSecret is enabled (secret names start with <environment>/<serviceName>/)" .Values.environment) (required "serviceName is required" .Values.serviceName) }}
    {{- end }}
    {{- if .Values.externalSecret.data }}
    {{- $remote = required "externalSecret.remoteSecretName is required" $remote }}
    {{- if not (hasPrefix $prefix $remote) }}
    {{- fail (printf "externalSecret.remoteSecretName %q must start with %q (only this service's own secrets)" $remote $prefix) }}
    {{- end }}
    {{- end }}
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ $remote | quote }}
        property: {{ .property | quote }}
    {{- end }}
    {{- range .Values.externalSecret.extraData }}
    {{- if not (hasPrefix $prefix .remoteSecretName) }}
    {{- fail (printf "externalSecret.extraData remoteSecretName %q must start with %q (only this service's own secrets)" .remoteSecretName $prefix) }}
    {{- end }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteSecretName | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
