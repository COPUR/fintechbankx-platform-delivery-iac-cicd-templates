# Value names deliberately differ from charts/fintechbankx-service.
env:
  DB_URL: jdbc:postgresql://db.example.internal:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
additionalEnv: []
additionalEnvFrom: []
jvmOptions: "-XX:MaxRAMPercentage=75"
kafkaRuntime: msk
# While enabled the guard pins configMapName, key and mountPath to
# rds-ca-bundle, global-bundle.pem and /etc/fintechbankx/rds-ca; the adapter
# passes all of them.
databaseCaBundle:
  enabled: true
  configMapName: rds-ca-bundle
  mountPath: /etc/fintechbankx/rds-ca
  key: global-bundle.pem
secrets:
  enabled: true
  keys:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      property: password
  dataFrom: []
