  # --- part B: payments (mandates, bulk, request-to-pay) and open finance ------------
  # Same common wiring as the five above (local profile only, mem_limit, 8080 and
  # 8081, readiness healthcheck), checked against each application.yml at its r8
  # head. Flyway runs in-process at start-up as the app role in every PostgreSQL
  # one (bulk and request-to-pay do not create their schema: postgres/init does,
  # owned by the role); no migrate one-shot. The three data services keep their
  # read model in MongoDB as their own user (mongo-init) and build their consent
  # projection from evt.of.consent.v1 (groups cg.<service id>.consent-projection.v1,
  # DLQs evt.of.account / corporate / metadata .dlq.v1 from the topic catalog, set
  # in their application.yml). Products and atm serve public data: no Keycloak, no
  # Kafka. The eight that ship an OTLP exporter and map
  # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT send to the collector (observability profile)
  # once FBX_TRACING_ENABLED=true. Outbox relays stay off (OUTBOX_RELAY_ENABLED
  # default false) except consent's (decision D4).
  payment-recurring-mandates-service:
    image: ${FBX_IMAGE_PAY_RECURRING_MANDATES:-fintechbankx/payment-recurring-mandates-service:local}
    profiles: [payments, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      topic-init: {condition: service_completed_successfully}
    environment:
      # local: application-local.yml sets fintechbankx.tls.enforce: false (PLAINTEXT Kafka, PostgreSQL without TLS)
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_pay_recurring_mandates_local
      DB_USERNAME: pay_recurring_mandates_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_PAY_RECURRING_MANDATES:?run compose/fbx-local.sh init}
      # the outbox relay (evt.pay.mandate.v1, OUTBOX_RELAY_ENABLED, off by default) publishes here
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      # Outbound client-credentials token (registrations consent-service and
      # accounts-service, client id SERVICE_CLIENT_ID, default svc-pay-recurring-mandates,
      # whose realm client has the svc-of-consent-authorization audience).
      SERVICE_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_PAY_RECURRING_MANDATES:?run compose/fbx-local.sh init}
      OIDC_TOKEN_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/token
      # Every mandate is bound to a PSU-authorised consent (GET /api/v1/consents/{id},
      # CONSENT_ADAPTER default http); the default URL is a cluster DNS name.
      # Consent is in the payments profile too (decision D2).
      CONSENT_SERVICE_BASE_URL: http://consent-authorization-service:8080
      # Decision D3: no accounts service exists; the default (http) answers 503 on
      # every call. The in-memory adapter holds demo accounts (local runs only).
      ACCOUNTS_ADAPTER: in-memory
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "127.0.0.1:18060:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

