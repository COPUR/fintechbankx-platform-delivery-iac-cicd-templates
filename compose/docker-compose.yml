      OPENFINANCE_INTERNAL_USERNAME: ${FBX_OF_CONSENT_INTERNAL_USER:?run compose/fbx-local.sh init}
      OPENFINANCE_INTERNAL_PASSWORD: ${FBX_OF_CONSENT_INTERNAL_CRED:?run compose/fbx-local.sh init}
