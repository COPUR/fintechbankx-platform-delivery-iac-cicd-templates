      mongo-init: {condition: service_completed_successfully}
      realm-import: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      topic-init: {condition: service_completed_successfully}
    environment:
      # local: application-local.yml sets fintechbankx.tls.enforce: false (PLAINTEXT Kafka, MongoDB without TLS); never the aws profile
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      MONGODB_URI: mongodb://business_financial_data_app:${FBX_DB_CRED_OF_BUSINESS_FINANCIAL_DATA:?run compose/fbx-local.sh init}@mongo:27017/db_of_business_financial_data_local
      OPENFINANCE_BFD_CACHE_MODE: inmemory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      DPOP_PUBLIC_BASE_URL: http://127.0.0.1:18120
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "127.0.0.1:18120:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  banking-metadata-service:
    image: ${FBX_IMAGE_OF_BANKING_METADATA:-fintechbankx/banking-metadata-service:local}
    profiles: [openfinance, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      realm-import: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      topic-init: {condition: service_completed_successfully}
    environment:
      # local: application-local.yml sets fintechbankx.tls.enforce: false (PLAINTEXT Kafka, MongoDB without TLS); never the aws profile
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      # decision D9: the runbook's database (db_of_banking_metadata_<env>), not the
      # application.yml default banking_metadata_local
      MONGODB_URI: mongodb://metadata_app:${FBX_DB_CRED_OF_BANKING_METADATA:?run compose/fbx-local.sh init}@mongo:27017/db_of_banking_metadata_local
      OPENFINANCE_BM_CACHE_MODE: inmemory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      DPOP_PUBLIC_BASE_URL: http://127.0.0.1:18130
      # no tracing bridge in this service: no tracing settings
    ports:
      - "127.0.0.1:18130:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Public catalogue: no resource server, no Kafka client; PostgreSQL only.
  open-products-catalog-service:
    image: ${FBX_IMAGE_OF_OPEN_PRODUCTS_CATALOG:-fintechbankx/open-products-catalog-service:local}
    profiles: [openfinance, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # local: application-local.yml sets fintechbankx.tls.enforce: false (PostgreSQL without TLS)
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_of_open_products_catalog_local
      DB_USERNAME: open_products_catalog_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_OF_OPEN_PRODUCTS_CATALOG:?run compose/fbx-local.sh init}
      # Decision D6: no SAMPLE-* products (db/seed afterMigrate callback).
      OPEN_PRODUCTS_SEED_ENABLED: "false"
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "127.0.0.1:18140:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Public directory: no resource server, no Kafka client, no tracing; PostgreSQL
  # only (read-only pool; Flyway on its own connection, FLYWAY_URL default DB_URL).
  atm-directory-service:
    image: ${FBX_IMAGE_OF_ATM_DIRECTORY:-fintechbankx/atm-directory-service:local}
    profiles: [openfinance, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # local: application-local.yml sets fintechbankx.tls.enforce: false (PostgreSQL without TLS)
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_of_atm_directory_local
      DB_USERNAME: atm_directory_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_OF_ATM_DIRECTORY:?run compose/fbx-local.sh init}
      # Decision D6: no sample ATMs (db/seed).
      ATM_DIRECTORY_SEED_ENABLED: "false"
    ports:
      - "127.0.0.1:18150:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Comparison target for the regression parity suite, side by side. Default
  # wiring is for the monolith-oracle app (enterprise-loan-management-system
  # regression-parity/monolith-oracle): ORACLE_PORT, OIDC_ISSUER_URI (the
  # in-stack Keycloak issuer as tokens carry it), OIDC_JWK_SET_URI (in-network),
  # Spring profile `local` (its in-memory repositories) and /actuator/health.
  # For the full ELMS image set FBX_MONOLITH_SPRING_PROFILES=docker and
  # FBX_MONOLITH_HEALTH_PATH=/api/actuator/health; the datasource, Redis and
  # Kafka settings below are for that image and ignored by the oracle.
  monolith:
    image: ${FBX_MONOLITH_IMAGE:-enterprise-loan-system:1.0.0}
    profiles: [monolith]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      parity-admin-permissions: {condition: service_completed_successfully, required: false}
    environment:
      SPRING_PROFILES_ACTIVE: ${FBX_MONOLITH_SPRING_PROFILES:-local}
      ORACLE_PORT: "8080"
      SERVER_PORT: "8080"
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_elms_monolith_local
      SPRING_DATASOURCE_USERNAME: elms_monolith_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_ELMS_MONOLITH:?run compose/fbx-local.sh init}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_CRED:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:18000:8080"
    # curl, wget or bash (the oracle's eclipse-temurin JRE base has bash).
    healthcheck:
      test: ["CMD-SHELL", "url=http://127.0.0.1:8080${FBX_MONOLITH_HEALTH_PATH:-/actuator/health}; curl -fsS \"$$url\" >/dev/null 2>&1 || wget -qO- \"$$url\" >/dev/null 2>&1 || FBX_HC_PATH=\"${FBX_MONOLITH_HEALTH_PATH:-/actuator/health}\" bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET %s HTTP/1.0\\r\\n\\r\\n\" \"$$FBX_HC_PATH\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres-data:
