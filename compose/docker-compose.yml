# FinTechBankX shared local / ephemeral runtime (Proposed).
#
# Split-world replacement for the monolith's docker-compose.yml,
# docker-compose.open-finance-eventing.yml and docker/init-scripts:
#   core (always):  postgres 16 (one database + schema + role per service),
#                   kafka (single-broker KRaft) + topic-init from the Kafka repo's catalog,
#                   keycloak 26 + realm-import of the identity repo's realm
#                   + admin-permissions (its fine-grained admin permissions step)
#   profiles:       lending (loan + customer), payments (initiation + risk + compliance + customer),
#                   customer, riskcompliance, openfinance (mongo + mongo-init so far),
#                   services (all five + mongo), monolith (ELMS / monolith-oracle side by side,
#                   with redis), observability (otel-collector + jaeger),
#                   parity-fixtures (regression parity test actors layered onto the realm, plus
#                   parity-suite's admin permission on /customers; ephemeral/local only)
#   one-shots:      topic-init, realm-import, admin-permissions, mongo-init and
#                   <service>-migrate (customer, risk, compliance: Flyway before the service)
#
# Never start it directly: compose/fbx-local.sh fetches the platform assets into
# .cache/, generates .env and realm.env (random dev-only credentials, git-ignored)
# and then calls docker compose. Every credential below is `${VAR:?...}` so the
# file cannot run with a committed default.
#
# Host ports bind to 127.0.0.1 only: postgres 15432, mongo 37017, kafka 29092,
# keycloak 8180, jaeger UI 16686, services 18010-18050 (services.tsv host_port),
# monolith 18000.
#
# Extra per-service environment (e.g. OUTBOX_RELAY_ENABLED=true) comes from
# the override rendered by `fbx-local.sh service-env FILE` (scripts/service-env.mjs).
name: fintechbankx-local

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_CRED:?run compose/fbx-local.sh init}
      POSTGRES_DB: postgres
      FBX_SERVICES_TSV: /fbx/services.tsv
      FBX_DB_CRED_LN_LOAN_LIFECYCLE: ${FBX_DB_CRED_LN_LOAN_LIFECYCLE:?run compose/fbx-local.sh init}
      FBX_DB_CRED_PAY_INITIATION_SETTLEMENT: ${FBX_DB_CRED_PAY_INITIATION_SETTLEMENT:?run compose/fbx-local.sh init}
      FBX_DB_CRED_CUS_PROFILE_KYC: ${FBX_DB_CRED_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
      FBX_DB_CRED_RSK_DECISIONING: ${FBX_DB_CRED_RSK_DECISIONING:?run compose/fbx-local.sh init}
      FBX_DB_CRED_CMP_EVIDENCE: ${FBX_DB_CRED_CMP_EVIDENCE:?run compose/fbx-local.sh init}
      FBX_DB_CRED_ELMS_MONOLITH: ${FBX_DB_CRED_ELMS_MONOLITH:?run compose/fbx-local.sh init}
    volumes:
      - ./services.tsv:/fbx/services.tsv:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Same broker definition as fintechbankx-platform-event-streaming-kafka deploy/local.
  kafka:
    image: confluentinc/cp-kafka:7.9.8
    hostname: kafka
    environment:
      CLUSTER_ID: T-ELaTAgUxm_j7DpuTtlaQ
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Topics from the Kafka repo catalog (topics/generated/topics.tsv), RF 1 locally.
  topic-init:
    image: confluentinc/cp-kafka:7.9.8
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REPLICATION_FACTOR: "1"
      MIN_INSYNC_REPLICAS: "1"
      TOPICS_FILE: /opt/fbx/topics/generated/topics.tsv
      CREATE_LEGACY_TOPICS: ${FBX_CREATE_LEGACY_TOPICS:-false}
    volumes:
      - ./.cache/kafka/scripts/kafka:/opt/fbx/scripts/kafka:ro
      - ./.cache/kafka/topics/generated:/opt/fbx/topics/generated:ro
    entrypoint: ["bash", "/opt/fbx/scripts/kafka/create-topics.sh"]
    restart: "no"

  # Dev-mode Keycloak, same major as the identity repo (26.7.5). Issuer as seen
  # from the host: http://localhost:8180/realms/fintechbankx.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?run compose/fbx-local.sh init}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_CRED:?run compose/fbx-local.sh init}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Applies the identity repo's realm (fetched into .cache/identity) with the
  # same keycloak-config-cli image the identity repo pins; placeholders come
  # from the generated realm.env.
  realm-import:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      keycloak:
        condition: service_healthy
    env_file: ${FBX_REALM_ENV_FILE:-realm.env}
    volumes:
      - ./.cache/identity:/config:ro
    restart: "no"

  # Second step of the identity repo's realm import (its realm-import Job runs
  # the same script): fine-grained admin permissions (Keycloak 26 FGAP v2) from
  # realm/admin-permissions.json, e.g. the customer service's view/manage-members
  # permission on /customers, which keycloak-config-cli cannot import. Also
  # narrows client scope mappings to the realm file. Spec and script are fetched
  # into .cache/identity-admin (outside the realm-import glob). Logs in as the
  # local Keycloak bootstrap admin (password grant on admin-cli, master realm);
  # gets only that login, not the other realm.env values. Idempotent.
  admin-permissions:
    image: docker.io/library/node:22.22.0-alpine3.22@sha256:7aa86fa052f6e4b101557ccb56717cb4311be1334381f526fe013418fe157384
    depends_on:
      realm-import:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_LOGINREALM: master
      KEYCLOAK_GRANTTYPE: password
      KEYCLOAK_USER: ${KC_ADMIN_USER:?run compose/fbx-local.sh init}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_CRED:?run compose/fbx-local.sh init}
    volumes:
      - ./.cache/identity:/config:ro
      - ./.cache/identity-admin:/opt/fbx:ro
    command:
      - sh
      - -c
      - |
        if [ -f /opt/fbx/admin-permissions.json ]; then
          exec node /opt/fbx/apply-admin-permissions.mjs --spec /opt/fbx/admin-permissions.json --realm /config/fintechbankx-realm.json
        fi
        if grep -Eq '"adminPermissionsEnabled"[[:space:]]*:[[:space:]]*true' /config/fintechbankx-realm.json; then
          echo "admin-permissions: FAILED: the realm enables admin permissions but .cache/identity-admin is empty; run compose/fbx-local.sh fetch" >&2
          exit 1
        fi
        echo "admin-permissions: the realm does not enable admin permissions; nothing to apply"
    restart: "no"

  # --- parity-fixtures profile -------------------------------------------------------
  # Regression parity test actors (users banker, admin, loan_officer,
  # compliance_officer, auditor, customer, other-customer, customer-owner, the
  # confidential parity-suite client, the key-bound TPP-001, TPP-002 and
  # parity-channel clients and their parity-psu-* scopes) layered onto the
  # imported realm. Rendered by
  # `init-env.sh --parity-fixtures` into .cache/parity from
  # keycloak/parity-fixtures.template.json; credentials come from realm.env.
  # Ephemeral/local only: never part of the identity repo's realm. Runs without
  # remote state and with every managed resource type on no-delete, so it only
  # adds to what realm-import created.
  parity-fixtures-import:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    profiles: [parity-fixtures]
    depends_on:
      realm-import:
        condition: service_completed_successfully
    env_file: ${FBX_REALM_ENV_FILE:-realm.env}
    environment:
      IMPORT_FILES_LOCATIONS: file:/config/*.json
      IMPORT_REMOTESTATE_ENABLED: "false"
      IMPORT_MANAGED_CLIENT: no-delete
      IMPORT_MANAGED_ROLE: no-delete
      IMPORT_MANAGED_GROUP: no-delete
      IMPORT_MANAGED_COMPONENT: no-delete
      IMPORT_MANAGED_SUBCOMPONENT: no-delete
      IMPORT_MANAGED_CLIENTSCOPE: no-delete
      IMPORT_MANAGED_SCOPEMAPPING: no-delete
      IMPORT_MANAGED_REQUIREDACTION: no-delete
      IMPORT_MANAGED_AUTHENTICATIONFLOW: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDER: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDERMAPPER: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONRESOURCES: no-delete
      IMPORT_MANAGED_MESSAGEBUNDLES: no-delete
    volumes:
      - ./.cache/parity:/config:ro
    restart: "no"

  # parity-suite's fine-grained admin permission (FGAP v2): view-members and
  # manage-members on /customers, like the customer service's, so the suite can
  # read and link /customers users in Keycloak mode. keycloak/parity-admin-permissions.json
  # (own permission and policy names) applied with the identity repo's script
  # from .cache/identity-admin; no --realm, so scope-mapping reconciliation stays
  # with the identity step. Same login as admin-permissions. Idempotent.
  parity-admin-permissions:
    image: docker.io/library/node:22.22.0-alpine3.22@sha256:7aa86fa052f6e4b101557ccb56717cb4311be1334381f526fe013418fe157384
    profiles: [parity-fixtures]
    depends_on:
      admin-permissions:
        condition: service_completed_successfully
      parity-fixtures-import:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_LOGINREALM: master
      KEYCLOAK_GRANTTYPE: password
      KEYCLOAK_USER: ${KC_ADMIN_USER:?run compose/fbx-local.sh init}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_CRED:?run compose/fbx-local.sh init}
    volumes:
      - ./.cache/identity-admin:/opt/fbx:ro
      - ./keycloak/parity-admin-permissions.json:/opt/parity/admin-permissions.json:ro
    command:
      - sh
      - -c
      - |
        if [ ! -f /opt/fbx/apply-admin-permissions.mjs ]; then
          echo "parity-admin-permissions: FAILED: .cache/identity-admin has no apply-admin-permissions.mjs; run compose/fbx-local.sh fetch with an identity ref whose realm enables admin permissions" >&2
          exit 1
        fi
        exec node /opt/fbx/apply-admin-permissions.mjs --spec /opt/parity/admin-permissions.json
    restart: "no"

  # --- observability profile --------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  # --- openfinance profile: MongoDB -------------------------------------------------
  # Store of the services.tsv rows with store=mongodb (decision D10): MongoDB 7.0,
  # the line the open-finance services' own CI runs (mongo:7 / mongo:7.0, no
  # digest pinned there), so pinned here by full version tag. Root login only
  # for mongo-init; the services get one user each, limited to their own
  # database. No named volume: down and reset (rm -v) drop its anonymous volume
  # with the container, like the PostgreSQL data.
  mongo:
    image: mongo:7.0.41
    profiles: [openfinance, services]
    environment:
      MONGO_INITDB_ROOT_USERNAME: fbx-local-root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_CRED:?run compose/fbx-local.sh init}
    ports:
      - "127.0.0.1:37017:27017"
    # Through the service name, not 127.0.0.1: the image's first-start init
    # runs a temporary mongod bound to 127.0.0.1 only, which must not count.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongo", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One user per mongodb row of services.tsv with readWrite on its own
  # database only (credential FBX_DB_CRED_* of the row); re-runnable, like
  # topic-init. Services with store=mongodb wait for it. Lists the credential
  # of every mongodb row (none yet).
  mongo-init:
    image: mongo:7.0.41
    profiles: [openfinance, services]
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      FBX_SERVICES_TSV: /fbx/services.tsv
      FBX_MONGO_URI: mongodb://mongo:27017/admin
      MONGO_ROOT_USER: fbx-local-root
      MONGO_ROOT_CRED: ${MONGO_ROOT_CRED:?run compose/fbx-local.sh init}
    volumes:
      - ./services.tsv:/fbx/services.tsv:ro
      - ./mongo/init:/fbx/mongo-init:ro
    entrypoint: ["bash", "/fbx/mongo-init/10-service-databases.sh"]
    restart: "no"

  # --- monolith profile -----------------------------------------------------------
  redis:
    image: redis:7.4.1-alpine
    profiles: [monolith]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_AUTH\" --save '' --appendonly no"]
    environment:
      REDIS_AUTH: ${REDIS_CRED:?run compose/fbx-local.sh init}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- service profiles ---------------------------------------------------------------
  # Wiring checked against each service's application.yml at its current head.
  # Common to every service:
  #   SPRING_PROFILES_ACTIVE=local and no other profile: the only switch that turns
  #     off the startup TLS assertion (loan, initiation: application-local.yml;
  #     customer, risk, compliance: by the profile name, StartupAssertions), which
  #     refuses the stack's PLAINTEXT Kafka and PostgreSQL without TLS. Never a
  #     FINTECHBANKX_TLS_* variable, never DB_SSL_ROOT_CERT (no CA bundle here).
  #   mem_limit (decision D11): FBX_SERVICE_MEM_LIMIT, default 768m, the smallest
  #     memory limit in the services' Helm values; the images size the heap at
  #     75 % of it (MaxRAMPercentage=75) instead of 75 % of the host.
  #   No OTEL_* variables: Spring Boot 3.3.6 reads none and none of these five
  #     services maps one or ships an OTLP exporter.
  loan-lifecycle-service:
    image: ${FBX_IMAGE_LN_LOAN_LIFECYCLE:-fintechbankx/loan-lifecycle-service:local}
    profiles: [lending, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      topic-init: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-ln-loan-lifecycle
      # local: application-local.yml sets fintechbankx.tls.enforce: false, so PLAINTEXT Kafka and PostgreSQL without TLS are allowed
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_ln_loan_lifecycle_local
      DB_USERNAME: loan_lifecycle_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_LN_LOAN_LIFECYCLE:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      # Outbound client-credentials token (registration customer-service, client
      # id SERVICE_CLIENT_ID, default svc-ln-loan-lifecycle): the secret realm-import
      # gives that client, fetched in-network (the default is localhost:8180).
      SERVICE_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_LN_LOAN_LIFECYCLE:?run compose/fbx-local.sh init}
      OIDC_TOKEN_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/token
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
      # No default in the service: an empty adapter creates no CustomerCreditService
      # and the service does not start. http = customer-profile-kyc-service, which
      # every profile that starts loan also starts. The ledger currency (used when a
      # credit response names none) is that of the customer service's parity seed.
      CUSTOMER_CREDIT_ADAPTER: http
      CUSTOMER_CREDIT_LEDGER_CURRENCY: USD
      CUSTOMER_SERVICE_BASE_URL: http://customer-profile-kyc-service:8080
    ports:
      - "127.0.0.1:18010:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  payment-initiation-settlement-service:
    image: ${FBX_IMAGE_PAY_INITIATION_SETTLEMENT:-fintechbankx/payment-initiation-settlement-service:local}
    profiles: [payments, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      topic-init: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-pay-initiation-settlement
      # local: application-local.yml sets fintechbankx.tls.enforce: false, so PLAINTEXT Kafka and PostgreSQL without TLS are allowed
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_pay_initiation_settlement_local
      DB_USERNAME: payment_initiation_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_PAY_INITIATION_SETTLEMENT:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      # Outbound client-credentials token (registration fintechbankx-service, client
      # id SERVICE_CLIENT_ID, default svc-pay-initiation-settlement) for risk,
      # compliance and the customer KYC read.
      SERVICE_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_PAY_INITIATION_SETTLEMENT:?run compose/fbx-local.sh init}
      OIDC_TOKEN_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/token
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
      # Required, no default in the service; the same currency as loan's ledger.
      PAYMENT_DEFAULT_CURRENCY: USD
      # Decision D3: no accounts service exists; the default (http) needs
      # ACCOUNTS_SERVICE_BASE_URL and fails at start-up without it. The in-memory
      # demo accounts hold PAYMENT_DEFAULT_CURRENCY.
      ACCOUNTS_ADAPTER: in-memory
      # Defaults are cluster DNS names. The KYC read runs before every payment
      # (fail closed), so the payments profile starts customer too.
      RISK_SERVICE_BASE_URL: http://risk-decisioning-service:8080
      COMPLIANCE_SERVICE_BASE_URL: http://compliance-evidence-service:8080
      CUSTOMER_SERVICE_BASE_URL: http://customer-profile-kyc-service:8080
    ports:
      - "127.0.0.1:18020:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Customer, risk and compliance only validate their Flyway history at start-up
  # (<context>.database.flyway=validate) and refuse an empty database. Their
  # image migrates when its first argument is "migrate" (DatabaseMigration: the
  # datasource and Flyway only, with the db-migrate profile added to local, then
  # exit); the chart runs that as a pre-install Job, compose as a one-shot of the
  # same image that the service waits for. Locally the app role owns its schema,
  # so it is also the schema owner Flyway migrates as (no DB_MIGRATION_*).
  customer-profile-kyc-service-migrate:
    image: ${FBX_IMAGE_CUS_PROFILE_KYC:-fintechbankx/customer-profile-kyc-service:local}
    profiles: [lending, customer, payments, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/db_cus_profile_kyc_local
      DB_USERNAME: customer_profile_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
    restart: "no"

  customer-profile-kyc-service:
    image: ${FBX_IMAGE_CUS_PROFILE_KYC:-fintechbankx/customer-profile-kyc-service:local}
    # payments: initiation reads the KYC status before every payment
    profiles: [lending, customer, payments, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
    depends_on:
      postgres: {condition: service_healthy}
      customer-profile-kyc-service-migrate: {condition: service_completed_successfully}
      realm-import: {condition: service_completed_successfully}
      # identity link (PUT .../identity-link) needs its admin permission on /customers
      admin-permissions: {condition: service_completed_successfully}
      # waits for the parity actors only when the parity-fixtures profile is on
      parity-fixtures-import: {condition: service_completed_successfully, required: false}
      parity-admin-permissions: {condition: service_completed_successfully, required: false}
      topic-init: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-cus-profile-kyc
      # local: no application-local.yml; the TLS guards are off by the profile name (StartupAssertions)
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_cus_profile_kyc_local
      DB_USERNAME: customer_profile_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      # token azp values allowed to call (read by the service as SERVICE_CALLERS;
      # the KYC read's SERVICE_CALLERS_KYC defaults to svc-pay-initiation-settlement)
      SERVICE_CALLERS: svc-ln-loan-lifecycle
      # Identity link through the Keycloak admin API (off by default: 503), as
      # the service's own realm client (IDENTITY_ADMIN_CLIENT_ID default
      # svc-cus-profile-kyc, realm default fintechbankx): client credentials
      # with the secret realm-import gives it; its service account holds the
      # FGAP permission on /customers that admin-permissions applies.
      IDENTITY_ADMIN_ENABLED: "true"
      KEYCLOAK_BASE_URL: http://keycloak:8080
      IDENTITY_ADMIN_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:18030:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  risk-decisioning-service-migrate:
    image: ${FBX_IMAGE_RSK_DECISIONING:-fintechbankx/risk-decisioning-service:local}
    profiles: [payments, riskcompliance, services]
    mem_limit: ${FBX_SERVICE_MEM_LIMIT:-768m}
