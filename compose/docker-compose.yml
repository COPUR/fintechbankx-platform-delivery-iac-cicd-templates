# FinTechBankX shared local / ephemeral runtime (Proposed).
#
# Split-world replacement for the monolith's docker-compose.yml,
# docker-compose.open-finance-eventing.yml and docker/init-scripts:
#   core (always):  postgres 16 (one database + schema + role per service),
#                   kafka (single-broker KRaft) + topic-init from the Kafka repo's catalog,
#                   keycloak 26 + realm-import of the identity repo's realm
#   profiles:       lending, payments, customer, riskcompliance, services (all five),
#                   monolith (ELMS side by side, with redis), observability (otel-collector + jaeger)
#
# Never start it directly: compose/fbx-local.sh fetches the platform assets into
# .cache/, generates .env and realm.env (random dev-only credentials, git-ignored)
# and then calls docker compose. Every credential below is `${VAR:?...}` so the
# file cannot run with a committed default.
#
# Host ports bind to 127.0.0.1 only: postgres 15432, kafka 29092, keycloak 8180,
# jaeger UI 16686, services 18010-18050, monolith 18000.
name: fintechbankx-local

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_CRED:?run compose/fbx-local.sh init}
      POSTGRES_DB: postgres
      FBX_SERVICES_TSV: /fbx/services.tsv
      FBX_DB_CRED_LN_LOAN_LIFECYCLE: ${FBX_DB_CRED_LN_LOAN_LIFECYCLE:?run compose/fbx-local.sh init}
      FBX_DB_CRED_PAY_INITIATION_SETTLEMENT: ${FBX_DB_CRED_PAY_INITIATION_SETTLEMENT:?run compose/fbx-local.sh init}
      FBX_DB_CRED_CUS_PROFILE_KYC: ${FBX_DB_CRED_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
      FBX_DB_CRED_RSK_DECISIONING: ${FBX_DB_CRED_RSK_DECISIONING:?run compose/fbx-local.sh init}
      FBX_DB_CRED_CMP_EVIDENCE: ${FBX_DB_CRED_CMP_EVIDENCE:?run compose/fbx-local.sh init}
      FBX_DB_CRED_ELMS_MONOLITH: ${FBX_DB_CRED_ELMS_MONOLITH:?run compose/fbx-local.sh init}
    volumes:
      - ./services.tsv:/fbx/services.tsv:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Same broker definition as fintechbankx-platform-event-streaming-kafka deploy/local.
  kafka:
    image: confluentinc/cp-kafka:7.9.8
    hostname: kafka
    environment:
      CLUSTER_ID: T-ELaTAgUxm_j7DpuTtlaQ
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Topics from the Kafka repo catalog (topics/generated/topics.tsv), RF 1 locally.
  topic-init:
    image: confluentinc/cp-kafka:7.9.8
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      REPLICATION_FACTOR: "1"
      MIN_INSYNC_REPLICAS: "1"
      TOPICS_FILE: /opt/fbx/topics/generated/topics.tsv
      CREATE_LEGACY_TOPICS: ${FBX_CREATE_LEGACY_TOPICS:-false}
    volumes:
      - ./.cache/kafka/scripts/kafka:/opt/fbx/scripts/kafka:ro
      - ./.cache/kafka/topics/generated:/opt/fbx/topics/generated:ro
    entrypoint: ["bash", "/opt/fbx/scripts/kafka/create-topics.sh"]
    restart: "no"

  # Dev-mode Keycloak, same major as the identity repo (26.7.5). Issuer as seen
  # from the host: http://localhost:8180/realms/fintechbankx.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?run compose/fbx-local.sh init}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_CRED:?run compose/fbx-local.sh init}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Applies the identity repo's realm (fetched into .cache/identity) with the
  # same keycloak-config-cli image the identity repo pins; placeholders come
  # from the generated realm.env.
  realm-import:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      keycloak:
        condition: service_healthy
    env_file: ${FBX_REALM_ENV_FILE:-realm.env}
    volumes:
      - ./.cache/identity:/config:ro
    restart: "no"

  # --- observability profile --------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  # --- monolith profile -----------------------------------------------------------
  redis:
    image: redis:7.4.1-alpine
    profiles: [monolith]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_AUTH\" --save '' --appendonly no"]
    environment:
      REDIS_AUTH: ${REDIS_CRED:?run compose/fbx-local.sh init}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  loan-lifecycle-service:
    image: ${FBX_IMAGE_LN_LOAN_LIFECYCLE:-fintechbankx/loan-lifecycle-service:local}
    profiles: [lending, services]
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-ln-loan-lifecycle
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_ln_loan_lifecycle_local
      DB_USERNAME: loan_lifecycle_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_LN_LOAN_LIFECYCLE:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      OIDC_CLIENT_ID: svc-ln-loan-lifecycle
      OIDC_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_LN_LOAN_LIFECYCLE:?run compose/fbx-local.sh init}
      OTEL_SERVICE_NAME: svc-ln-loan-lifecycle
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
      CUSTOMER_SERVICE_BASE_URL: http://customer-profile-kyc-service:8080
    ports:
      - "127.0.0.1:18010:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  payment-initiation-settlement-service:
    image: ${FBX_IMAGE_PAY_INITIATION_SETTLEMENT:-fintechbankx/payment-initiation-settlement-service:local}
    profiles: [payments, services]
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-pay-initiation-settlement
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_pay_initiation_settlement_local
      DB_USERNAME: payment_initiation_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_PAY_INITIATION_SETTLEMENT:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      OIDC_CLIENT_ID: svc-pay-initiation-settlement
      OIDC_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_PAY_INITIATION_SETTLEMENT:?run compose/fbx-local.sh init}
      OTEL_SERVICE_NAME: svc-pay-initiation-settlement
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:18020:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  customer-profile-kyc-service:
    image: ${FBX_IMAGE_CUS_PROFILE_KYC:-fintechbankx/customer-profile-kyc-service:local}
    profiles: [lending, customer, services]
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-cus-profile-kyc
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_cus_profile_kyc_local
      DB_USERNAME: customer_profile_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      OIDC_CLIENT_ID: svc-cus-profile-kyc
      OIDC_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_CUS_PROFILE_KYC:?run compose/fbx-local.sh init}
      OTEL_SERVICE_NAME: svc-cus-profile-kyc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:18030:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  risk-decisioning-service:
    image: ${FBX_IMAGE_RSK_DECISIONING:-fintechbankx/risk-decisioning-service:local}
    profiles: [payments, riskcompliance, services]
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-rsk-decisioning
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_rsk_decisioning_local
      DB_USERNAME: risk_decisioning_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_RSK_DECISIONING:?run compose/fbx-local.sh init}
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      OIDC_CLIENT_ID: svc-rsk-decisioning
      OIDC_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_RSK_DECISIONING:?run compose/fbx-local.sh init}
      OTEL_SERVICE_NAME: svc-rsk-decisioning
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:18040:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  compliance-evidence-service:
    image: ${FBX_IMAGE_CMP_EVIDENCE:-fintechbankx/compliance-evidence-service:local}
    profiles: [payments, riskcompliance, services]
    depends_on:
      postgres: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
    environment:
      FINTECHBANKX_SERVICE_ID: svc-cmp-evidence
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/db_cmp_evidence_local
      DB_USERNAME: compliance_evidence_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_CMP_EVIDENCE:?run compose/fbx-local.sh init}
      OIDC_ISSUER_URI: http://localhost:8180/realms/fintechbankx
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/certs
      OIDC_CLIENT_ID: svc-cmp-evidence
      OIDC_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_CMP_EVIDENCE:?run compose/fbx-local.sh init}
      OTEL_SERVICE_NAME: svc-cmp-evidence
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MANAGEMENT_TRACING_ENABLED: ${FBX_TRACING_ENABLED:-false}
    ports:
      - "127.0.0.1:18050:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Enterprise Loan Management System, side by side for regression comparison.
  monolith:
    image: ${FBX_MONOLITH_IMAGE:-enterprise-loan-system:1.0.0}
    profiles: [monolith]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: ${FBX_MONOLITH_SPRING_PROFILES:-docker}
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_elms_monolith_local
      SPRING_DATASOURCE_USERNAME: elms_monolith_app
      SPRING_DATASOURCE_PASSWORD: ${FBX_DB_CRED_ELMS_MONOLITH:?run compose/fbx-local.sh init}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_CRED:?run compose/fbx-local.sh init}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:18000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080${FBX_MONOLITH_HEALTH_PATH:-/api/actuator/health} >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres-data:
