      SERVICE_CLIENT_SECRET: ${FBX_OIDC_SECRET_SVC_PAY_BULK_ORCHESTRATION:?run compose/fbx-local.sh init}
      OIDC_TOKEN_URI: http://keycloak:8080/realms/fintechbankx/protocol/openid-connect/token
