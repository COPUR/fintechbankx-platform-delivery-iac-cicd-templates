name: Required Gates

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 23
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -x ./gradlew ]; then
            if [ -x ./gradlew ]; then
              if ! ./gradlew --no-daemon clean assemble -x test; then
                if [ -f .ci/allow-gradle-fail ]; then
                  echo "Gradle build failed but .ci/allow-gradle-fail is present; continuing."
                else
                  exit 1
                fi
              fi
            elif command -v gradle >/dev/null 2>&1; then
              if ! gradle --no-daemon clean assemble -x test; then
                if [ -f .ci/allow-gradle-fail ]; then
                  echo "Gradle build failed but .ci/allow-gradle-fail is present; continuing."
                else
                  exit 1
                fi
              fi
            else
              echo "Gradle requested but unavailable; skipping Gradle build."
            fi
          else
            echo "No Gradle root build in this repository; skipping Gradle build."
          fi
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json build in this repository; skipping Node build."
          fi

  test:
    name: ci/test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 23
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -x ./gradlew ]; then
            if [ -x ./gradlew ]; then
              if ! ./gradlew --no-daemon test; then
                if [ -f .ci/allow-gradle-fail ]; then
                  echo "Gradle test failed but .ci/allow-gradle-fail is present; continuing."
                else
                  exit 1
                fi
              fi
            elif command -v gradle >/dev/null 2>&1; then
              if ! gradle --no-daemon test; then
                if [ -f .ci/allow-gradle-fail ]; then
                  echo "Gradle test failed but .ci/allow-gradle-fail is present; continuing."
                else
                  exit 1
                fi
              fi
            else
              echo "Gradle requested but unavailable; skipping Gradle test."
            fi
          else
            echo "No Gradle root test task in this repository; skipping Gradle test."
          fi
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No package.json test in this repository; skipping Node test."
          fi

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src/main/java ]; then
            if grep -R -nE "Map<\s*String\s*,\s*Object\s*>" src/main/java --include="*Controller.java"; then
              echo "Generic Map<String,Object> payloads are disallowed in controllers."
              exit 1
            fi
          else
            echo "No Java controller sources in this repository; guardrail check skipped."
          fi

  security:
    name: ci/security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          # Release asset for the runner's architecture, checked against the sha256
          # from the release's own checksums file before it is extracted. Another
          # version or architecture fails until its sha256 are added here.
          case "$(uname -m)" in
            x86_64) arch=x64; sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) arch=arm64; sha=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "::error::no gitleaks build for runner architecture $(uname -m)"; exit 1 ;;
          esac
          if [ "$GITLEAKS_VERSION" != "8.24.3" ]; then
            echo "::error::no pinned sha256 for gitleaks $GITLEAKS_VERSION; add the release's sha256 for each architecture to this step"
            exit 1
          fi
          dir="$RUNNER_TEMP/fbx-tools/gitleaks"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "${sha}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$dir" -f "$dir/gitleaks.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
              --report-format json --report-path gitleaks-report.json
          else
            gitleaks detect --source . --no-banner --redact --no-git \
              --report-format json --report-path gitleaks-report.json
          fi
