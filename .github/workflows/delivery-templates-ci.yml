name: delivery-templates-ci

# Validates this repository's own deliverables: every workflow (actionlint,
# including the sample callers checked against the local reusable workflows),
# the generic Helm chart (lint, template, kubeconform, negative cases,
# strict-mTLS scan of the rendered output, helm-unittest) and the Node tests
# (strict-mTLS validator, compose runtime incl. `docker compose config` and the
# per-service database init against PostgreSQL 16, ephemeral-env structure).

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

concurrency:
  group: delivery-templates-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.7
  HELM_VERSION: v3.16.3
  KUBECONFORM_VERSION: v0.6.7
  KUBE_VERSION: 1.30.0
  HELM_UNITTEST_VERSION: v0.7.2

jobs:
  actionlint:
    name: delivery/actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install actionlint
        run: |
          set -euo pipefail
          # Release asset for the runner's architecture, checked against the sha256
          # from the release's own checksums file before it is extracted. Another
          # version or architecture fails until its sha256 are added here.
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 ;;
            aarch64|arm64) arch=arm64; sha=401942f9c24ed71e4fe71b76c7d638f66d8633575c4016efd2977ce7c28317d0 ;;
            *) echo "::error::no actionlint build for runner architecture $(uname -m)"; exit 1 ;;
          esac
          if [ "$ACTIONLINT_VERSION" != "1.7.7" ]; then
            echo "::error::no pinned sha256 for actionlint $ACTIONLINT_VERSION; add the release's sha256 for each architecture to this step"
            exit 1
          fi
          dir="$RUNNER_TEMP/fbx-tools/actionlint"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          echo "${sha}  $dir/actionlint.tar.gz" | sha256sum -c -
          tar -xz -C "$dir" -f "$dir/actionlint.tar.gz" actionlint
          echo "$dir" >> "$GITHUB_PATH"
      - name: Lint workflows (shellcheck is preinstalled on the runner)
        run: bash scripts/ci/lint-workflows.sh

  helm-chart:
    name: delivery/helm-chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install kubeconform
        run: |
          set -euo pipefail
          # Release asset for the runner's architecture, checked against the sha256
          # from the release's own checksums file before it is extracted. Another
          # version or architecture fails until its sha256 are added here.
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73 ;;
            aarch64|arm64) arch=arm64; sha=dc82f79bb03c5479b1ae5fd4af221e4b5a3111f62bf01a2795d9c5c20fa96644 ;;
            *) echo "::error::no kubeconform build for runner architecture $(uname -m)"; exit 1 ;;
          esac
          if [ "$KUBECONFORM_VERSION" != "v0.6.7" ]; then
            echo "::error::no pinned sha256 for kubeconform $KUBECONFORM_VERSION; add the release's sha256 for each architecture to this step"
            exit 1
          fi
          dir="$RUNNER_TEMP/fbx-tools/kubeconform"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${arch}.tar.gz"
          echo "${sha}  $dir/kubeconform.tar.gz" | sha256sum -c -
          tar -xz -C "$dir" -f "$dir/kubeconform.tar.gz"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}"
      - run: npm ci
      - name: Validate chart (lint, template, kubeconform, negatives, helm-unittest)
        run: bash scripts/ci/validate-chart.sh

  node-validation:
    name: delivery/node-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # compose/test runs the per-service database init against this server.
      FBX_TEST_PGHOST: localhost
      FBX_TEST_PGPORT: "5432"
      FBX_TEST_PGUSER: postgres
      FBX_TEST_PGPASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # helm-deploy's render guard tests package their charts with helm; in CI they fail without it.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run validate:strict-mtls

  archunit-gate:
    name: delivery/archunit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "23"
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Test the ArchUnit gate (clean fixtures pass, violating fixture fails each rule)
        run: tools/archunit-gate/gradlew -p tools/archunit-gate --no-daemon test installDist

