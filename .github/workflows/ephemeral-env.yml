name: ephemeral-env

# Reusable ephemeral environment on the runner: the shared compose runtime of
# this repository (compose/: PostgreSQL per service, MongoDB for the three
# open-finance data services, KRaft Kafka with the catalog topics, Keycloak
# with the fintechbankx realm and its fine-grained admin permissions), the
# requested service images and optionally the monolith side by side. Waits for every container to
# be healthy, runs the caller's test command (e.g. a regression suite comparing
# monolith and service responses), uploads results and logs, and always tears
# the stack down.
#
# Callers must grant contents: read and id-token: write (ECR pulls via OIDC;
# GitHub checks a called workflow's permissions statically).
#
# The identity repository (realm) is private: pass a token that can read it as
# secret platform-assets-token (a fine-grained token or GitHub App installation
# token with contents: read on the identity and event-streaming repositories).
# The fetch treats the token as opaque: current installation tokens
# (ghs_<app id>_<JWT>, with dots and dashes) pass, and only a quote, backslash,
# whitespace or control character is refused. Without the secret the fetch uses
# the caller's github.token, which cannot read another private repository, so
# GitHub refuses the request and the fetch stops with the HTTP status and its
# likely cause. Only the fetch command sees the token; it reaches curl on stdin,
# never in a command line or the log.
#
# Runner: the runner input, else the caller repository's CI_RUNNER_ENV variable,
# else ubuntu-latest. The self-hosted environment VM is labelled fbx-ci-env and
# registered on the monolith repository only, with CI_RUNNER_ENV=fbx-ci-env there.
# Run the caller from main through workflow_dispatch only (never on pull_request):
# a self-hosted runner must not run code from a pull request.
#
# The VM has at most 12 GiB, which does not hold all 15 services, the monolith and
# the shared containers at once. Run one lane at a time (compose/lanes.tsv:
# lending, payments, openfinance) and pass memory-budget-mib (11264 on a 12 GiB VM:
# 12 GiB less 1 GiB for the OS and Docker); the memory plan step then fails before
# anything starts when the planned peak does not fit. compose/README.md has the plan.
#
# Usage (caller job):
#   regression:
#     uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/ephemeral-env.yml@main
#     permissions:
#       contents: read
#       id-token: write
#     strategy:
#       max-parallel: 1   # one lane at a time on the one VM
#       matrix:
#         lane: [lending, payments, openfinance]
#     with:
#       lane: ${{ matrix.lane }}
#       memory-budget-mib: 11264
#       service-images: |
#         FBX_IMAGE_LN_LOAN_LIFECYCLE=<account>.dkr.ecr.me-central-1.amazonaws.com/fintechbankx/loan-lifecycle-service@sha256:<digest>
#       # either a pinned image ...
#       monolith-image: <account>.dkr.ecr.me-central-1.amazonaws.com/elms/monolith-oracle@sha256:<digest>
#       # ... or built here from the caller checkout (not both):
#       # monolith-build-command: ./gradlew :regression-parity:monolith-oracle:installDist
#       # monolith-build-context: regression-parity/monolith-oracle
#       # java-version: "23"
#       parity-fixtures: true
#       sql-fixtures: |
#         customer-profile-kyc-service=db/fixtures/parity_seed_customers.sql
#       service-env: |
#         payment-initiation-settlement-service__OUTBOX_RELAY_ENABLED=true
#       seed-command: ./scripts/seed.sh
#       test-command: regression-parity/scripts/compare-monolith.sh
#       aws-role-to-assume: arn:aws:iam::<account>:role/<ci-ecr-pull-role>
#     secrets:
#       platform-assets-token: ${{ secrets.PLATFORM_ASSETS_TOKEN }}
#
# The validated lane reaches the seed and test commands as FBX_LANE (set only
# when lane is given). Read "$FBX_LANE" inside the command or script; never write
# the lane expression into seed-command or test-command, because an expression
# is pasted into the command text before any shell or validation sees it. The
# validate step checks every value it writes to GITHUB_ENV before it writes any,
# and refuses a line break in its one-line inputs, so no input that step reads
# can add a GITHUB_ENV line of its own (a second FBX_LANE, or any other name).
# monolith-build-command, seed-command and test-command are the caller's own
# code: like any step, they can still append to GITHUB_ENV, FBX_LANE included,
# for the steps after them.
#
# Order once the stack is healthy: sql-fixtures, seed-command, test-command.
# The seed and test commands run in the caller's checkout with these variables:
#   FBX_BASE_URL_<SERVICE> (e.g. FBX_BASE_URL_LN_LOAN_LIFECYCLE=http://127.0.0.1:18010),
#   FBX_MONOLITH_BASE_URL, FBX_OIDC_ISSUER, FBX_KAFKA_BOOTSTRAP, FBX_ENV_FILE
#   (generated credentials, for client-credentials tokens; with parity-fixtures
#   also PARITY_USERNAME_<ACTOR>, PARITY_PASSWORD_<ACTOR>, PARITY_SECRET_<CLIENT>,
#   PARITY_TPP_CLIENT_ID, PARITY_TPP_PRIVATE_JWK, PARITY_TPP_OTHER_CLIENT_ID,
#   PARITY_TPP_OTHER_PRIVATE_JWK, PARITY_CHANNEL_CLIENT_ID and
#   PARITY_CHANNEL_PRIVATE_JWK; see compose/README.md),
#   LEGACY_OPEN_FINANCE_HOST (the legacy open-finance API the mesh gateway routes to:
#   by default the monolith container as reached from the runner, 127.0.0.1:18000,
#   with FBX_LEGACY_OPEN_FINANCE_BASE_URL; unset when the monolith is not started)
#   and FBX_RESULTS_DIR (anything written there is uploaded; it also holds the memory
#   plan). Every generated credential is masked in the logs.
#
# mode: only `compose` is implemented. `kind` (helm install of
# charts/fintechbankx-service into a kind cluster) is a documented follow-up:
# the chart needs the backing services reachable from the cluster first.

on:
  workflow_call:
    inputs:
      mode:
        description: compose (implemented) or kind (follow-up, fails with a message).
        type: string
        default: compose
      runner:
        description: Runner label for the job; empty = the caller repository's CI_RUNNER_ENV variable, else ubuntu-latest.
        type: string
        default: ""
      lane:
        description: One lane of compose/lanes.tsv instead of profiles - lending (loan, customer, risk, compliance), payments (the four payment services with customer, risk, compliance and consent) or openfinance (the seven open-finance services and MongoDB). Exclusive with a non-default profiles.
        type: string
        default: ""
      memory-budget-mib:
        description: Memory the containers may use together, in MiB (11264 on the 12 GiB fbx-ci-env VM). The memory plan fails before the stack starts when the planned peak is larger; 0 = report only, with a warning when the peak exceeds the runner's memory less 1 GiB.
        type: number
        default: 0
      profiles:
        description: Space separated compose profiles (see compose/README.md) - lending, payments (with consent), customer, riskcompliance, openfinance (the seven open-finance services and MongoDB), services (the default - all 15 services), observability; monolith and parity-fixtures come from their own inputs.
        type: string
        default: services
      service-images:
        description: Newline separated FBX_IMAGE_<SERVICE>=<image@digest or image:tag> lines (see compose/services.tsv). Unlisted services use fintechbankx/<service>:local.
        type: string
        default: ""
      monolith-image:
        description: Pinned monolith / monolith-oracle image (digest or immutable tag). Non-empty adds the monolith profile. Exclusive with monolith-build-context.
        type: string
        default: ""
      monolith-build-context:
        description: Docker build context for the monolith image, relative to the caller workspace (e.g. regression-parity/monolith-oracle). Built with a local tag; adds the monolith profile.
        type: string
        default: ""
      monolith-build-command:
        description: Optional command run in the caller workspace before the docker build (e.g. ./gradlew :regression-parity:monolith-oracle:installDist).
        type: string
        default: ""
      java-version:
        description: Temurin JDK set up before monolith-build-command; empty = runner default.
        type: string
        default: ""
      monolith-spring-profiles:
        description: SPRING_PROFILES_ACTIVE of the monolith (local = monolith-oracle; docker for the full ELMS image).
        type: string
        default: local
      monolith-health-path:
        description: Health path on the monolith port (/actuator/health for monolith-oracle, /api/actuator/health for the full ELMS image).
        type: string
        default: /actuator/health
      legacy-open-finance-host:
        description: LEGACY_OPEN_FINANCE_HOST for the seed and test commands - monolith (the monolith container, when it runs), a host[:port], or empty for none.
        type: string
        default: monolith
      parity-fixtures:
        description: Add the regression parity test actors (users per role, parity-suite client) to the ephemeral realm; credentials in FBX_ENV_FILE.
        type: boolean
        default: false
      sql-fixtures:
        description: Newline separated <service>=<path> lines (path relative to the caller workspace); each SQL file runs against that service's own database with its own role after the stack is healthy.
        type: string
        default: ""
      service-env:
        description: Newline separated <service>__<VAR>=<value> lines of extra service environment (credential, identity/database wiring, Spring profile, configuration source, JVM option, spring.main, Kafka security, spring.ssl and schema-management names are rejected).
        type: string
        default: ""
      seed-command:
        description: Optional command run in the caller checkout after sql-fixtures and before test-command, with the same environment.
        type: string
        default: ""
      test-command:
        description: Command run in the caller checkout once the stack is healthy.
        type: string
        required: true
      working-directory:
        description: Directory of the caller checkout to run the test command in.
        type: string
        default: "."
      platform-repository:
        type: string
        default: COPUR/fintechbankx-platform-delivery-iac-cicd-templates
      platform-ref:
        description: Ref of this repository providing compose/.
        type: string
        default: main
      identity-ref:
        description: Ref of the identity repo for the realm.
        type: string
        default: main
      kafka-ref:
        description: Ref of the event-streaming repo for the topic catalog.
        type: string
        default: main
      aws-region:
        type: string
        default: me-central-1
      aws-role-to-assume:
        description: Role allowed to pull the images from ECR. Empty = no registry login.
        type: string
        default: ""
      wait-timeout-seconds:
        type: number
        default: 600
      timeout-minutes:
        type: number
        default: 45
    secrets:
      platform-assets-token:
        description: "Token with contents: read on the identity and event-streaming repositories (the realm repository is private); default the caller's github.token, which cannot read another private repository."
        required: false

permissions:
  contents: read

jobs:
  ephemeral:
    name: ephemeral-env/${{ inputs.mode }}
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_ENV || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ephemeral-env-${{ github.repository }}-${{ github.ref }}-${{ inputs.lane }}-${{ inputs.profiles }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      FBX_COMPOSE: ${{ github.workspace }}/.fbx-platform/compose
      FBX_RESULTS_DIR: ${{ github.workspace }}/.fbx-results
    steps:
      - name: Checkout caller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout platform compose runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.platform-repository }}
          ref: ${{ inputs.platform-ref }}
          path: .fbx-platform
          sparse-checkout: compose

      - name: Validate inputs and export images
        env:
          MODE: ${{ inputs.mode }}
          SERVICE_IMAGES: ${{ inputs.service-images }}
          MONOLITH_IMAGE: ${{ inputs.monolith-image }}
          MONOLITH_PROFILES: ${{ inputs.monolith-spring-profiles }}
          REQUESTED_PROFILES: ${{ inputs.profiles }}
          LANE: ${{ inputs.lane }}
          LEGACY_OF_HOST: ${{ inputs.legacy-open-finance-host }}
          MONOLITH_BUILD_CONTEXT: ${{ inputs.monolith-build-context }}
          MONOLITH_HEALTH_PATH: ${{ inputs.monolith-health-path }}
          PARITY_FIXTURES: ${{ inputs.parity-fixtures }}
          SERVICE_ENV: ${{ inputs.service-env }}
          SQL_FIXTURES: ${{ inputs.sql-fixtures }}
        run: |
          set -euo pipefail
          # No value reaches GITHUB_ENV before every check below has passed (all are written
          # together at the end), and no one-line input may hold a line break: a CR or LF would
          # add its own NAME=value line (FBX_LANE=<anything>, or any other name) for later steps.
          for input in mode:MODE lane:LANE profiles:REQUESTED_PROFILES monolith-image:MONOLITH_IMAGE \
            monolith-spring-profiles:MONOLITH_PROFILES monolith-build-context:MONOLITH_BUILD_CONTEXT \
            monolith-health-path:MONOLITH_HEALTH_PATH legacy-open-finance-host:LEGACY_OF_HOST; do
            name="${input#*:}"
            if [[ "${!name:-}" == *[$'\r\n']* ]]; then
              echo "::error::${input%%:*} must be a single line"; exit 1
            fi
          done
          exports=()
          if [ "$MODE" != "compose" ]; then
            echo "::error::mode '$MODE' is not implemented; only compose is (kind is a documented follow-up)"
            exit 1
          fi
          image_ok() { [[ "$1" =~ ^[a-z0-9./_:-]+(@sha256:[a-f0-9]{64}|:[A-Za-z0-9._-]+)$ && ! "$1" =~ :latest$ ]]; }
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ ! "$line" =~ ^(FBX_IMAGE_[A-Z_]+)=(.+)$ ]]; then
              echo "::error::service-images line must be FBX_IMAGE_<SERVICE>=<image>: $line"; exit 1
            fi
            var="${BASH_REMATCH[1]}"; image="${BASH_REMATCH[2]}"
            grep -qP "\t${var}\t" "$FBX_COMPOSE/services.tsv" || { echo "::error::$var is not in compose/services.tsv"; exit 1; }
            image_ok "$image" || { echo "::error::$var must be pinned by digest or an immutable tag (no latest): $image"; exit 1; }
            exports+=("$var=$image")
          done <<< "$SERVICE_IMAGES"
          profiles="$REQUESTED_PROFILES"
          # A lane (compose/lanes.tsv) stands for its profiles; profiles keeps its default then.
          if [ -n "$LANE" ]; then
            [[ "$LANE" =~ ^[a-z0-9-]+$ ]] || { echo "::error::lane must be a name from compose/lanes.tsv"; exit 1; }
            if [ "$REQUESTED_PROFILES" != services ]; then
              echo "::error::set lane or profiles, not both"; exit 1
            fi
            profiles="$(awk -F '\t' -v lane="$LANE" '!/^#/ && $1 == lane { print $2; exit }' "$FBX_COMPOSE/lanes.tsv")"
            [ -n "$profiles" ] || { echo "::error::unknown lane $LANE; compose/lanes.tsv lists the lanes"; exit 1; }
            # The seed and test commands read the lane from here, after it is validated.
            exports+=("FBX_LANE=$LANE")
          fi
          if [ -n "$LEGACY_OF_HOST" ] && [ "$LEGACY_OF_HOST" != monolith ] \
            && [[ ! "$LEGACY_OF_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$ ]]; then
            echo "::error::legacy-open-finance-host must be monolith, a host[:port] or empty"; exit 1
          fi
          if [ -n "$MONOLITH_IMAGE" ] && [ -n "$MONOLITH_BUILD_CONTEXT" ]; then
            echo "::error::set monolith-image or monolith-build-context, not both"; exit 1
          fi
          if [ -n "$MONOLITH_IMAGE" ]; then
            image_ok "$MONOLITH_IMAGE" || { echo "::error::monolith-image must be pinned: $MONOLITH_IMAGE"; exit 1; }
            exports+=("FBX_MONOLITH_IMAGE=$MONOLITH_IMAGE")
          fi
          if [ -n "$MONOLITH_BUILD_CONTEXT" ]; then
            if [[ "$MONOLITH_BUILD_CONTEXT" == /* || "/$MONOLITH_BUILD_CONTEXT/" == */../* ]]; then
              echo "::error::monolith-build-context must be relative to the caller workspace: $MONOLITH_BUILD_CONTEXT"; exit 1
            fi
          fi
          if [ -n "$MONOLITH_IMAGE$MONOLITH_BUILD_CONTEXT" ]; then
            [[ "$MONOLITH_HEALTH_PATH" =~ ^/[A-Za-z0-9/_.-]*$ ]] || { echo "::error::monolith-health-path is not a path: $MONOLITH_HEALTH_PATH"; exit 1; }
            if [[ ! "$MONOLITH_PROFILES" =~ ^[A-Za-z0-9,_-]+$ ]]; then
              echo "::error::monolith-spring-profiles must be Spring profile names (letters, digits, comma, _ and -)"; exit 1
            fi
            exports+=("FBX_MONOLITH_SPRING_PROFILES=$MONOLITH_PROFILES" "FBX_MONOLITH_HEALTH_PATH=$MONOLITH_HEALTH_PATH")
            profiles="$profiles monolith"
          fi
          if [ "$PARITY_FIXTURES" = true ]; then profiles="$profiles parity-fixtures"; fi
          # Each word is a compose profile name (the memory plan step then fails on one that
          # matches no container); they are written separated by single spaces.
          read -ra words <<< "$profiles"
          for p in "${words[@]}"; do
            [[ "$p" =~ ^[a-z0-9-]+$ ]] || { echo "::error::profiles: '$p' is not a compose profile name (a-z, 0-9 and -)"; exit 1; }
          done
          exports+=("FBX_PROFILES_RESOLVED=${words[*]}")
          printf '%s\n' "${exports[@]}" >> "$GITHUB_ENV"
          # Extra service environment -> compose override (validated by service-env.mjs).
          printf '%s\n' "$SERVICE_ENV" > "$RUNNER_TEMP/service-env.txt"
          bash "$FBX_COMPOSE/fbx-local.sh" service-env "$RUNNER_TEMP/service-env.txt"
          # SQL fixture list: services and paths checked now, applied after health.
          printf '%s\n' "$SQL_FIXTURES" > "$RUNNER_TEMP/sql-fixtures.txt"
          bash "$FBX_COMPOSE/scripts/apply-sql-fixtures.sh" --fixtures "$RUNNER_TEMP/sql-fixtures.txt" \
            --base-dir "$GITHUB_WORKSPACE" --check
          mkdir -p "$FBX_RESULTS_DIR/logs"

      - name: Configure AWS credentials (OIDC, image pulls)
        if: ${{ inputs.aws-role-to-assume != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          role-session-name: gha-ephemeral-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        if: ${{ inputs.aws-role-to-assume != '' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up JDK for the monolith build
        if: ${{ inputs.monolith-build-context != '' && inputs.java-version != '' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Build monolith image from the caller checkout
        if: ${{ inputs.monolith-build-context != '' }}
        working-directory: ${{ github.workspace }}
        env:
          BUILD_COMMAND: ${{ inputs.monolith-build-command }}
          BUILD_CONTEXT: ${{ inputs.monolith-build-context }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD_COMMAND" ]; then bash -c "$BUILD_COMMAND"; fi
          [ -d "$BUILD_CONTEXT" ] || { echo "::error::monolith-build-context not found: $BUILD_CONTEXT"; exit 1; }
          # Local tag only, never pushed; unique per run.
          tag="fbx-local/monolith:${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$tag" "$BUILD_CONTEXT"
          echo "FBX_MONOLITH_IMAGE=$tag" >> "$GITHUB_ENV"

      - name: Fetch platform assets and generate dev-only credentials
        env:
          FBX_IDENTITY_REF: ${{ inputs.identity-ref }}
          FBX_KAFKA_REF: ${{ inputs.kafka-ref }}
          FBX_GITHUB_TOKEN: ${{ secrets.platform-assets-token || github.token }}
          PARITY_FIXTURES: ${{ inputs.parity-fixtures }}
        run: |
          set -euo pipefail
          bash "$FBX_COMPOSE/fbx-local.sh" fetch
          # Only the fetch needs the token.
          unset FBX_GITHUB_TOKEN
          init_args=()
          if [ "$PARITY_FIXTURES" = true ]; then init_args+=(--parity-fixtures); fi
          bash "$FBX_COMPOSE/fbx-local.sh" init "${init_args[@]}"
          # Mask every generated value (credentials, parity passwords and secrets).
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            value="${line#*=}"
            [ "${#value}" -ge 16 ] && echo "::add-mask::$value"
          done < "$FBX_COMPOSE/.env"
          # Each parity private JWK (PARITY_*_PRIVATE_JWK) is one JSON line; also mask each private member.
          while IFS= read -r member; do
            [ -n "$member" ] && echo "::add-mask::$member"
          done < <(node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter((l) => /^PARITY_[A-Z0-9_]*PRIVATE_JWK=/.test(l));
            for (const line of lines) { const k = JSON.parse(line.slice(line.indexOf("=") + 1)); for (const m of ["d", "p", "q", "dp", "dq", "qi"]) if (k[m]) console.log(k[m]); }' "$FBX_COMPOSE/.env")

      - name: Plan memory for the requested profiles
        env:
          MEMORY_BUDGET_MIB: ${{ inputs.memory-budget-mib }}
        run: |
          set -euo pipefail
          # The compose model with the same files, generated .env and profiles as `up` (compose
          # config leaves out every service whose profile is not active); mem_limit in bytes.
          config="$RUNNER_TEMP/compose-config.json"
          FBX_PROFILES="$FBX_PROFILES_RESOLVED" bash "$FBX_COMPOSE/fbx-local.sh" compose config --format json > "$config"
          plan() { node "$FBX_COMPOSE/scripts/plan-memory.mjs" --config "$config" --profiles "$FBX_PROFILES_RESOLVED" "$@"; }
          plan --budget-mib "$MEMORY_BUDGET_MIB" | tee "$FBX_RESULTS_DIR/memory-plan.txt"
          peak="$(plan --json | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0, "utf8")).peakMiB))')"
          host_mib=$(( $(awk '/^MemTotal:/ { print $2 }' /proc/meminfo) / 1024 ))
          if [ "$peak" -gt $(( host_mib - 1024 )) ]; then
            echo "::warning::planned peak ${peak} MiB exceeds this runner's ${host_mib} MiB less 1 GiB; containers may be killed. Run one lane at a time, or set memory-budget-mib to stop before the stack starts."
          fi

      - name: Start stack and wait for health
        env:
          FBX_WAIT_TIMEOUT: ${{ inputs.wait-timeout-seconds }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # profiles are a space separated list
          bash "$FBX_COMPOSE/fbx-local.sh" up $FBX_PROFILES_RESOLVED
          bash "$FBX_COMPOSE/fbx-local.sh" compose ps

      - name: Export test environment
        env:
          LEGACY_OF_HOST: ${{ inputs.legacy-open-finance-host }}
        run: |
          set -euo pipefail
          monolith_port=""
          legacy="${LEGACY_OF_HOST-monolith}"
          {
            # port is column 9; the trailing _ takes the store column and any later one.
            while IFS=$'\t' read -r key service_id _ _ _ _ _ _ port _; do
              [[ -z "$key" || "$key" == \#* ]] && continue
              if [ "$key" = monolith ]; then
                monolith_port="$port"
                echo "FBX_MONOLITH_BASE_URL=http://127.0.0.1:$port"
              else
                echo "FBX_BASE_URL_$(echo "${service_id#svc-}" | tr 'a-z-' 'A-Z_')=http://127.0.0.1:$port"
              fi
            done < "$FBX_COMPOSE/services.tsv"
            echo "FBX_OIDC_ISSUER=http://localhost:8180/realms/fintechbankx"
            echo "FBX_KAFKA_BOOTSTRAP=localhost:29092"
            echo "FBX_ENV_FILE=$FBX_COMPOSE/.env"
            # The legacy open-finance API (the mesh's LEGACY_OPEN_FINANCE_HOST): by default the
            # monolith container, as the runner reaches it; nothing when the monolith is not started.
            if [ "$legacy" = monolith ]; then
              if [[ " ${FBX_PROFILES_RESOLVED:-} " == *" monolith "* ]]; then
                echo "LEGACY_OPEN_FINANCE_HOST=127.0.0.1:$monolith_port"
                echo "FBX_LEGACY_OPEN_FINANCE_BASE_URL=http://127.0.0.1:$monolith_port"
              fi
            elif [ -n "$legacy" ]; then
              echo "LEGACY_OPEN_FINANCE_HOST=$legacy"
            fi
          } >> "$GITHUB_ENV"

      - name: Apply SQL fixtures
        if: ${{ inputs.sql-fixtures != '' }}
        run: |
          set -euo pipefail
          bash "$FBX_COMPOSE/scripts/apply-sql-fixtures.sh" --fixtures "$RUNNER_TEMP/sql-fixtures.txt" \
            --base-dir "$GITHUB_WORKSPACE" --env-file "$FBX_ENV_FILE"

      - name: Run seed command
        if: ${{ inputs.seed-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SEED_COMMAND: ${{ inputs.seed-command }}
        run: |
          set -euo pipefail
          bash -c "$SEED_COMMAND"

      - name: Run test command
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          bash -c "$TEST_COMMAND"

      - name: Collect container logs
        if: ${{ always() }}
        run: |
          set +e
          bash "$FBX_COMPOSE/fbx-local.sh" compose ps -a > "$FBX_RESULTS_DIR/logs/ps.txt" 2>&1
          for svc in $(bash "$FBX_COMPOSE/fbx-local.sh" compose ps -a --services 2>/dev/null); do
            bash "$FBX_COMPOSE/fbx-local.sh" compose logs --no-color --timestamps "$svc" > "$FBX_RESULTS_DIR/logs/$svc.log" 2>&1
          done
          exit 0

      - name: Upload results and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One artifact per lane, so the legs of a lane matrix do not collide.
          name: ephemeral-env-${{ inputs.lane || 'stack' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FBX_RESULTS_DIR }}
          # FBX_RESULTS_DIR is .fbx-results: upload-artifact skips hidden paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: ${{ always() }}
        run: bash "$FBX_COMPOSE/fbx-local.sh" down || true
