name: contract-checks

# Reusable API and event contract gates.
#
#   openapi:  Redocly lint, then oasdiff breaking-change check against the base
#             ref. A reviewed allowlist <spec>.accepted-breaking.txt next to a
#             spec (one oasdiff error per line, as in customer-profile-kyc-core)
#             is passed to --err-ignore; anything not listed still fails.
#             scripts/ci/fapi-dpop-guard.sh runs when the repo has it.
#   asyncapi: the provider gate of ADR-019 section 5 (adr-runbooks). The
#             specs are the top-level *.yaml / *.yml files of asyncapi-spec-dir
#             (default api/asyncapi; shared fragments such as
#             common/event-envelope.yaml live in subdirectories and are not
#             specs). Each is validated with the pinned @asyncapi/cli, then the
#             asyncapi catalog's scripts/ci/asyncapi-breaking.mjs, fetched at the
#             40-hex commit asyncapi-catalog-ref, compares them with the merge
#             base of origin/main (always main, also for stacked PRs). The
#             catalog script reads asyncapi/ at a repository root, so the step
#             "Stage specs for the catalog script" copies asyncapi-spec-dir at
#             the merge base and at HEAD into that layout in a scratch
#             repository; providers need no wrapper. A spec not on main yet is
#             skipped as new (first PR); removing a spec that is on main is a
#             finding. Accepted findings: <spec-name>.accepted-breaking.txt in
#             asyncapi-spec-dir, one finding key per line, only with a
#             documented major version (.v2 topic) and dual-publish plan.
#             publishes-events: true makes a missing spec an error.
#
# Usage (caller job):
#   contracts:
#     uses: COPUR/fintechbankx-platform-delivery-iac-cicd-templates/.github/workflows/contract-checks.yml@main
#     permissions:
#       contents: read
#     with:
#       publishes-events: true   # the service publishes domain events (ADR-019)

on:
  workflow_call:
    inputs:
      openapi-globs:
        description: Space separated git pathspecs for OpenAPI specs.
        type: string
        default: "openapi/*.yaml api/openapi/*.yaml src/main/resources/openapi/*.yaml"
      asyncapi-spec-dir:
        description: >-
          Repository-relative directory holding the service's AsyncAPI specs (top-level files only). Catalog-style
          repositories use asyncapi.
        type: string
        default: api/asyncapi
      asyncapi-globs:
        description: Replaced by asyncapi-spec-dir; setting it fails contracts/asyncapi so a caller does not lose its gate silently.
        type: string
        default: ""
      publishes-events:
        description: >-
          The repository publishes domain events, so it must own an AsyncAPI spec in asyncapi-spec-dir (ADR-019
          section 5): no spec fails contracts/asyncapi. false only skips the check when asyncapi-spec-dir has no spec
          on the branch or on origin/main.
        type: boolean
        default: false
      asyncapi-catalog-repository:
        description: Repository providing scripts/ci/asyncapi-breaking.mjs (the catalog's breaking-change rules).
        type: string
        default: COPUR/fintechbankx-governance-api-contracts-asyncapi-catalog
      asyncapi-catalog-ref:
        description: >-
          40-hex commit of asyncapi-catalog-repository the breaking-change rules are taken from. Branches and tags are
          rejected. Bump it in a reviewed PR of this repository when the catalog changes its rules.
        type: string
        default: e47c327eb7763232e986359225d733b9892f6b7b
      base-ref:
        description: Baseline for the breaking-change diff. Empty = the PR base branch, else origin/main.
        type: string
        default: ""
      redocly-version:
        type: string
        default: 1.27.1
      oasdiff-version:
        type: string
        default: 1.12.1
      asyncapi-cli-version:
        type: string
        default: 2.13.0
      run-fapi-guard:
        description: Run scripts/ci/fapi-dpop-guard.sh when present.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  openapi:
    name: contracts/openapi
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    concurrency:
      group: contract-checks-openapi-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find specs
        id: specs
        env:
          GLOBS: ${{ inputs.openapi-globs }}
        run: |
          set -euo pipefail
          read -r -a pathspecs <<< "$GLOBS"
          git ls-files -- "${pathspecs[@]}" > openapi-specs.txt
          count="$(wc -l < openapi-specs.txt | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "OpenAPI specs found: $count"
          cat openapi-specs.txt

      - name: Redocly lint
        if: ${{ steps.specs.outputs.count != '0' }}
        env:
          REDOCLY_VERSION: ${{ inputs.redocly-version }}
        run: |
          set -euo pipefail
          mapfile -t specs < openapi-specs.txt
          npx -y "@redocly/cli@${REDOCLY_VERSION}" lint "${specs[@]}"

      - name: Install oasdiff
        if: ${{ steps.specs.outputs.count != '0' }}
        env:
          OASDIFF_VERSION: ${{ inputs.oasdiff-version }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$tmpdir"
          sudo install "$tmpdir/oasdiff" /usr/local/bin/oasdiff

      - name: Breaking-change guard (oasdiff + accepted-breaking allowlist)
        if: ${{ steps.specs.outputs.count != '0' }}
        env:
          BASE_REF_INPUT: ${{ inputs.base-ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF_INPUT" ]; then
            base="$BASE_REF_INPUT"
          elif [ -n "$PR_BASE" ]; then
            base="origin/$PR_BASE"
          else
            base="origin/main"
          fi
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            git fetch --no-tags origin "${base#origin/}" --depth=1 || true
          fi
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "::warning::Baseline $base not found; breaking-change check skipped."
            exit 0
          fi
          tmpdir="$(mktemp -d)"
          fail=0
          while IFS= read -r spec; do
            if ! git cat-file -e "$base:$spec" 2>/dev/null; then
              echo "[oasdiff] new spec, no baseline: $spec"
              continue
            fi
            git show "$base:$spec" > "$tmpdir/base.yaml"
            ignore_args=()
            accepted="${spec%.*}.accepted-breaking.txt"
            if [ -f "$accepted" ]; then
              echo "[oasdiff] $spec: applying reviewed allowlist $accepted"
              ignore_args=(--err-ignore "$accepted")
            fi
            echo "[oasdiff] checking $spec against $base"
            if ! oasdiff breaking --fail-on ERR "${ignore_args[@]}" "$tmpdir/base.yaml" "$spec"; then
              echo "::error file=$spec::breaking change against $base (add a reviewed line to $accepted only with consumer sign-off and a version plan)"
              fail=1
            fi
          done < openapi-specs.txt
          exit "$fail"

      - name: FAPI / DPoP contract guard
        if: ${{ steps.specs.outputs.count != '0' && inputs.run-fapi-guard && hashFiles('scripts/ci/fapi-dpop-guard.sh') != '' }}
        run: bash scripts/ci/fapi-dpop-guard.sh

  asyncapi:
    name: contracts/asyncapi
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    concurrency:
      group: contract-checks-asyncapi-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      # Fixed by ADR-019 section 5 and the catalog's own gate: versions count from main, also for stacked PRs.
      BASE_REF: origin/main
    steps:
      - name: Pinned tool versions
        env:
          ASYNCAPI_CLI_VERSION: ${{ inputs.asyncapi-cli-version }}
          CATALOG_REF: ${{ inputs.asyncapi-catalog-ref }}
        run: |
          set -euo pipefail
          if ! [[ "$ASYNCAPI_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::asyncapi-cli-version must be an exact version (x.y.z), got '$ASYNCAPI_CLI_VERSION'"
            exit 1
          fi
          if ! [[ "$CATALOG_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::asyncapi-catalog-ref must be a 40-hex commit SHA (branches and tags move), got '$CATALOG_REF'"
            exit 1
          fi
          echo "@asyncapi/cli $ASYNCAPI_CLI_VERSION, breaking-change rules at catalog commit $CATALOG_REF"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the breaking-change check compares with the merge base of origin/main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Find AsyncAPI specs
        id: specs
        env:
          SPEC_DIR: ${{ inputs.asyncapi-spec-dir }}
          LEGACY_GLOBS: ${{ inputs.asyncapi-globs }}
          PUBLISHES_EVENTS: ${{ inputs.publishes-events }}
        run: |
          set -euo pipefail
          if [ -n "$LEGACY_GLOBS" ]; then
            echo "::error::asyncapi-globs is replaced by asyncapi-spec-dir (the directory whose top-level *.yaml / *.yml files are the specs)"
            exit 1
          fi
          dir="${SPEC_DIR%/}"
          if [ -z "$dir" ] || [[ "$dir" == /* ]] || [[ "$dir" =~ (^|/)\.\.?(/|$) ]] || [[ "$dir" =~ [[:space:]] ]]; then
            echo "::error::asyncapi-spec-dir must be a repository-relative directory without '.', '..' or whitespace, got '$SPEC_DIR'"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          # Top-level files only: :(glob) keeps * inside the directory, so common/ fragments are not specs.
          pathspecs=(":(glob)$dir/*.yaml" ":(glob)$dir/*.yml")
          git ls-files -- "${pathspecs[@]}" > asyncapi-specs.txt
          count="$(wc -l < asyncapi-specs.txt | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "AsyncAPI specs in $dir: $count"
          cat asyncapi-specs.txt

          if [ "$count" -eq 0 ] && [ "$PUBLISHES_EVENTS" = "true" ]; then
            echo "::error::publishes-events is true but $dir has no AsyncAPI spec. A repository that publishes events gates its own AsyncAPI spec (ADR-019 section 5): add $dir/<service-id>.yaml, or set asyncapi-spec-dir to where the spec lives."
            exit 1
          fi

          base=""
          if ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF#origin/}:refs/remotes/${BASE_REF}" >/dev/null 2>&1 || true
          fi
          : > asyncapi-base-specs.txt
          if git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            base="$(git merge-base "$BASE_REF" HEAD 2>/dev/null || git rev-parse "${BASE_REF}^{commit}")"
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff-tree -r --name-only --no-commit-id "$empty_tree" "$base" -- "${pathspecs[@]}" > asyncapi-base-specs.txt
          fi
          base_count="$(wc -l < asyncapi-base-specs.txt | tr -d ' ')"

          if [ "$count" -eq 0 ] && [ "$base_count" -eq 0 ]; then
            echo "No AsyncAPI specs in $dir on this branch or on $BASE_REF; check not applicable (publishes-events: false)."
            echo "breaking=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$base" ]; then
            echo "::error::$BASE_REF is not available; the AsyncAPI breaking-change check needs it (actions/checkout fetch-depth: 0)."
            exit 1
          fi
          # Also runs when every spec was removed on this branch: removed-spec is a finding, not a bypass.
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "breaking=true" >> "$GITHUB_OUTPUT"
          echo "Baseline: $BASE_REF merge base $base ($base_count spec(s) in $dir)"

      - name: AsyncAPI validate
        if: ${{ steps.specs.outputs.count != '0' }}
        env:
          ASYNCAPI_CLI_VERSION: ${{ inputs.asyncapi-cli-version }}
        run: |
          set -euo pipefail
          mapfile -t specs < asyncapi-specs.txt
          for spec in "${specs[@]}"; do
            echo "[asyncapi] validating $spec"
            npx -y "@asyncapi/cli@${ASYNCAPI_CLI_VERSION}" validate "$spec"
          done

      - name: Checkout AsyncAPI catalog rules (pinned commit)
        if: ${{ steps.specs.outputs.breaking == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.asyncapi-catalog-repository }}
          ref: ${{ inputs.asyncapi-catalog-ref }}
          path: .fbx-asyncapi-catalog
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Install AsyncAPI catalog dependencies
        if: ${{ steps.specs.outputs.breaking == 'true' }}
        working-directory: .fbx-asyncapi-catalog
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The catalog script reads asyncapi/*.y*ml at a repository root and the baseline from git (BASE_REF). This
      # step builds that layout in a scratch repository: its main is asyncapi-spec-dir at the merge base of
      # origin/main, its working tree is asyncapi-spec-dir at HEAD (common/ fragments and
      # <spec-name>.accepted-breaking.txt included). If the catalog script gains a spec-directory variable, delete
      # this step and run the script in the workspace with that variable and BASE_REF=origin/main.
      - name: Stage specs for the catalog script
        id: stage
        if: ${{ steps.specs.outputs.breaking == 'true' }}
        env:
          SPEC_DIR: ${{ steps.specs.outputs.dir }}
          BASE_SHA: ${{ steps.specs.outputs.base }}
        run: |
          set -euo pipefail
          root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/asyncapi-stage.XXXXXX")"
          g=(git -C "$root" -c user.name=asyncapi-gate -c user.email=asyncapi-gate@example.invalid -c commit.gpgsign=false)
          "${g[@]}" init -q -b main
          mkdir -p "$root/asyncapi"
          if git cat-file -e "$BASE_SHA:$SPEC_DIR" 2>/dev/null; then
            git archive --format=tar "$BASE_SHA:$SPEC_DIR" | tar -x -C "$root/asyncapi"
          fi
          "${g[@]}" add -A
          "${g[@]}" commit -q --allow-empty -m "$SPEC_DIR at the merge base of $BASE_REF"
          rm -rf "$root/asyncapi"
          mkdir -p "$root/asyncapi"
          if git cat-file -e "HEAD:$SPEC_DIR" 2>/dev/null; then
            git archive --format=tar "HEAD:$SPEC_DIR" | tar -x -C "$root/asyncapi"
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Staged $SPEC_DIR as asyncapi/ (main = $BASE_REF merge base ${BASE_SHA:0:12}, working tree = HEAD)"

      - name: AsyncAPI breaking-change check (catalog asyncapi-breaking.mjs)
        if: ${{ steps.specs.outputs.breaking == 'true' }}
        env:
          SPEC_DIR: ${{ steps.specs.outputs.dir }}
          STAGE_ROOT: ${{ steps.stage.outputs.root }}
          CATALOG_DIR: ${{ github.workspace }}/.fbx-asyncapi-catalog
        run: |
          set -euo pipefail
          script="$CATALOG_DIR/scripts/ci/asyncapi-breaking.mjs"
          if [ ! -f "$script" ]; then
            echo "::error::$script not found at the pinned catalog commit"
            exit 1
          fi
          echo "[asyncapi-breaking] $SPEC_DIR (staged as asyncapi/) against $BASE_REF"
          if ! (cd "$STAGE_ROOT" && BASE_REF=main node "$script"); then
            echo "::error::AsyncAPI breaking change in $SPEC_DIR against $BASE_REF (paths above are shown as asyncapi/). Publish a new major version on a new topic (.v2) with dual-publish, or list the finding keys in $SPEC_DIR/<spec-name>.accepted-breaking.txt with that plan (ADR-019 section 5)."
            exit 1
          fi
